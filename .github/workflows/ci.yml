name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A newer commit on the same pull request makes an older run's answer moot, so
# that run is cancelled. Only for pull requests: each of those checks the whole
# range from the base, whereas a push run checks only its own push, and
# cancelling one would let those commits skip the docs check.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suite runs offline in about a minute. GitHub's default limit is six
    # hours, which is what a hung test would otherwise cost.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # docs-check walks the commit range, so it needs real history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        # `web` is included even though nothing in verify *runs* the API,
        # because mypy is strict over all of src/ and src/eulerlab/api/server.py
        # imports fastapi. Without it the import is unresolved, every route
        # decorator becomes untyped, and the type gate fails on code that is
        # perfectly fine. Installing the extra is what lets mypy check that file
        # properly rather than what lets it skip it.
        run: uv sync --extra dev --extra web

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Docs check
        env:
          # On a PR, compare against the base commit. On a push, GitHub gives us
          # the previous SHA; docs_check.py falls back sensibly if it is unusable
          # (a brand-new branch reports an all-zero SHA).
          DOCS_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python tools/docs_check.py

      - name: State
        run: uv run python tools/state.py

  web:
    # The workbench's TypeScript had no check at all: a type error reached the
    # operator's browser before anything reported it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Typecheck the workbench
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
