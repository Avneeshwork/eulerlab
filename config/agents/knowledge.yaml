# The knowledge agent (ADR-085). Answers from what the platform holds, with sources.
name: knowledge
title: Knowledge agent
job: Answers questions about our papers, idea cards, results and datasets, looks every number up instead of remembering it, and names the source of each one.
worker: eulerlab.agents.workers.knowledge
schedule: "on demand; its index rebuilds after the close"
uses_model: true
daily_requests: 150
never:
  - write anything outside its own folder
  - trade, backtest or register
  - answer from memory when a lookup failed
needs_approval: false
