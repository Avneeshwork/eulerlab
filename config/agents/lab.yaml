# The idea lab (ADR-089, ADR-111, ADR-128): it backtests what the research agent
# found, after research and before engineering. It writes no ideas of its own
# (max_ideas and model_ideas are 0); its memory of every card tested is kept.
name: lab
title: Idea lab
reports_to: research
job: Comes after research. Backtests every new research draft it can build (IC screen, then a backtest, trials logged first), hands a draft whose signal the library lacks to engineering, and sends survivors attacked by the skeptic to your inbox. Writes no ideas of its own.
worker: eulerlab.agents.workers.lab
schedule: Every day 17:00 IST, after research (make agents-ideas)
uses_model: true
daily_requests: 4
needs_approval: true
never:
  - spend more trials than config/agent_trials.yaml allows, or test without logging the trial first
  - read the holdout, run the gate or edit gates.py or mandate.yaml
  - change a card after writing it, or tune a parameter after seeing its result
  - run model-written code you have not merged (a coded signal is used only after your merge)
options:
  # Research ideas only from 2026-11-03 (operator: "we have to backtest only
  # what research finds"); its own formula ideas back on 2026-11-04 (operator,
  # T-4458), at the settings before that switch. Research cards are still tested.
  max_ideas: 30
  max_cards: 10
  max_minutes: 90
  model_ideas: 6
  cli_only: true

# Everyday work and the tasks a head may give it (ADR-124).
duties:
  - Every day at 17:00, after research, backtest every new research draft it can build
  - Hand a draft whose signal the library lacks to engineering
  - Send survivors, attacked by the skeptic, to your inbox
can_do:
  - kind: test_card
    what: Test one named idea card (IC screen, then a backtest). Spends trials from the weekly allowance
    arg: card
    auto: false   # spends trials and runs from the terminal only (cli_only)
    words: [card, formula, test, backtest, screen]
