# The data agent (ADR-085). No model. Runs at 06:30 and after the close.
name: data
title: Data agent
reports_to: platform
job: Grades every dataset against the quality contract, flags what is behind, failed or changed format, and answers other agents' data requests.
worker: eulerlab.agents.workers.data
schedule: "06:30 and 16:15 on weekdays"
uses_model: false
daily_requests: 0
never:
  - edit, move or delete raw data
  - add a new data source (it proposes one)
  - change a strategy
needs_approval: true
options:
  auto_rerun: false      # true lets it re-run the allowed feed steps for stale datasets
  restore_sample: 0      # files to download back from B2 each run, to prove the backup restores
