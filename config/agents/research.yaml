# The research agent (ADR-085): the paper agent (ADR-084) plus a librarian pass.
# Since ADR-128 it runs first each day (research, then the lab, then engineering)
# and picks its own topic from `topics` below when no task or brief names one.
name: research
title: Research agent
reports_to: research
role: scout               # ADR-181
job: Goes first each day. Finds papers on the brief's topic, or the day's topic from its own list, keeps every paper it reads in the library, drafts idea cards for the idea lab to backtest, drops repeats of ideas already tested, asks the data agent for data it lacks, and ranks the drafts for you.
worker: eulerlab.agents.workers.research
schedule: "Every day 17:00 IST, before the idea lab (make agents-ideas)"
uses_model: true
daily_requests: 40
never:
  - register a hypothesis or spend a trial
  - backtest, validate or write to the trial ledger
  - invent a source or a URL
needs_approval: true
options:
  limit: 5
  # Where it looks, in this order (ADR-129). SSRN through OpenAlex (its own site
  # blocks robots), NBER through Crossref. A new source is a function in
  # research/paper_search.SOURCES and a line here.
  sources: [arxiv, openalex, ssrn, nber, core, semantic_scholar]
  topic: "Indian equities cross-sectional anomalies with low turnover"
  # Research goes first and picks its own topic (ADR-128): one a day from this
  # list, in turn, unless a task or your brief names one. The lab no longer chooses.
  topics:
    - "Indian equities cross-sectional anomalies with low turnover"
    - "price momentum Indian stocks"
    - "low volatility anomaly Indian stock market"
    - "short-term reversal Indian equities"
    - "liquidity premium Indian stocks"
    - "52-week high momentum India"
    - "volume and turnover signals Indian equities"
    - "intraday return patterns NSE stocks"
    # For the brief's next-session forecast (ADR-133): papers land in the library
    # for the forecast's yearly review; any tradable idea goes to the lab as usual.
    - "forecasting next-day stock index volatility from high-low range"
    - "overnight returns and opening gaps Indian stock index"

# Everyday work and the tasks a head may give it (ADR-124).
duties:
  - Every day at 17:00, find papers on the day's topic and draft idea cards
  - Drop ideas already tried, and ask the data agent for data it lacks
can_do:
  - kind: research_topic
    what: Find papers on a topic and draft idea cards from them
    arg: topic
    words: [paper, papers, research, topic, idea, ideas, anomaly, literature, study, studies, find, look]
