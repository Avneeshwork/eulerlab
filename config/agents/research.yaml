# The research agent (ADR-085): the paper agent (ADR-084) plus a librarian pass.
# Since ADR-111 it runs daily and takes its topic from the idea lab's feedback
# when no brief names one; `topic` below is the fallback.
name: research
title: Research agent
job: Finds papers on the brief's topic, or on the topic the idea lab's feedback names that day, drafts idea cards with what the lab has learned in hand, drops repeats of ideas already tried or tested, asks the data agent for data it lacks, and ranks the survivors for you.
worker: eulerlab.agents.workers.research
schedule: "Every day 17:00 IST, before the idea lab (make agents-ideas)"
uses_model: true
daily_requests: 40
never:
  - register a hypothesis or spend a trial
  - backtest, validate or write to the trial ledger
  - invent a source or a URL
needs_approval: true
options:
  limit: 5
  topic: "Indian equities cross-sectional anomalies with low turnover"
