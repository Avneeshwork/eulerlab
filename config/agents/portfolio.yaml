# The portfolio agent (ADR-085). No model.
name: portfolio
title: Portfolio agent
reports_to: portfolio
job: Proposes sizes for strategies that passed the gate and flags a deployed book that has drifted outside what its backtest showed.
worker: eulerlab.agents.workers.portfolio
schedule: "16:15 on weekdays"
uses_model: false
daily_requests: 0
never:
  - place or approve an order
  - re-tune a strategy
  - size anything the gate has not promoted
needs_approval: true
options:
  max_weight: 0.4
  band: 0.95
