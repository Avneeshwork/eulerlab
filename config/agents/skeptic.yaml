# The skeptic agent (ADR-085). Tries to prove a good result is fake.
name: skeptic
title: Skeptic agent
reports_to: research
role: red_team               # ADR-181
job: Attacks a stored result before the gate sees it - one lucky year, a few lucky days, costs, Indian stress windows - and writes the five ways it could be fake.
worker: eulerlab.agents.workers.skeptic
schedule: "on demand, for a result you name"
uses_model: true
provider: groq          # kept on free Groq for cost; its role routes elsewhere (ADR-181)
daily_requests: 20
never:
  - change a number in the evidence
  - read the holdout
  - touch the gate or the mandate
needs_approval: false

# Everyday work and the tasks a head may give it (ADR-124).
duties:
  - Attack the stored result you or a head names, before the gate sees it
  - Attack each lab survivor on its way to your inbox
can_do:
  - kind: attack_result
    what: Attack one strategy's stored result, or all of them with "all"
    arg: strategy
    words: [attack, skeptic, robust, robustness, overfit, overfitting, stress, doubt, fake, lucky, check, result]
