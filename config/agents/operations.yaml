# The operations agent (ADR-085). No model.
name: operations
title: Operations agent
reports_to: platform
job: Times every scheduled step against its deadline, says which is getting slower, and measures each paper book's gap to its backtest.
worker: eulerlab.agents.workers.operations
schedule: "16:15 and 20:30 on weekdays"
uses_model: false
daily_requests: 0
never:
  - place an order
  - restart or kill a job
needs_approval: false
options:
  deadlines:
    "feed: NSE end-of-day": 1800
    "feed: price panel": 900
    "feed: paper books": 600
  warn_share: 0.8

# Everyday work and the tasks a head may give it (ADR-124).
duties:
  - At 16:15 and 20:30 on weekdays, time every scheduled step against its deadline
  - Say which step is getting slower
  - Measure each paper book's gap to its backtest
can_do:
  - kind: check_operations
    what: Time the scheduled steps and measure each paper book's gap to its backtest, now
    words: [timing, timings, slow, slower, job, jobs, schedule, deadline, launchd, operations, gap, run, runs]
