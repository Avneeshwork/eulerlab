# The market brief agent (ADR-085). Numbers from the data; words labelled as commentary.
name: market_brief
title: Market brief agent
reports_to: portfolio
role: chief_of_staff               # ADR-181
job: Writes the pre-open brief at 08:45 and the after-close brief once the day's data is in, and rewrites it whenever the data refreshes.
worker: eulerlab.agents.workers.market_brief
schedule: "08:45 and 16:15 on weekdays, and after each data refresh"
uses_model: true
provider: groq          # kept on free Groq for cost; its role routes elsewhere (ADR-181)
daily_requests: 12
never:
  - feed a strategy or a deployment
  - state a number the data did not give it
needs_approval: false
options:
  telegram: true

# Everyday work and the tasks a head may give it (ADR-124).
duties:
  - Write the pre-open brief at 08:45 and the after-close brief at 16:15 on weekdays
  - Write a markets-closed note on closed days
can_do:
  - kind: write_brief
    what: Write the market brief now, pre-open or after-close
    arg: mode
    choices: [pre-open, after-close]
    words: [brief, market, markets, nifty, today, close, open, news, morning, evening, telegram]
