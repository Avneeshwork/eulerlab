    tree: fii_dii
    segment: trendlyne
    publisher: Trendlyne (republishing NSE's provisional figures)
    url: https://trendlyne.com/macro-data/fii-dii/latest/cash-pastmonth/
    # Terms read 2026-10-30: no use "in a searchable, machine-readable database"
    # without written authorisation. Collected anyway by operator decision
    # (ADR-009, ADR-099); never redistributed.
    licence: "restricted: Trendlyne terms bar machine-readable database use without written authorisation; operator decision ADR-099"
    knowledge_time: the scrape time; a backfilled day was not known here before it
    critical: false
    min_grade: C
    cross_check: make fii-dii-history (compares against NSE, Groww and stockezee)
    point_in_time: false

