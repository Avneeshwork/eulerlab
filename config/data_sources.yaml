# The data quality contract's source register (ADR-086).
#
# Every dataset the platform uses has one entry here. `make data-quality`
# grades each one against the same six checks, whatever the source:
#   1 registered   - it has an entry here
#   2 provenance   - publisher, address and licence status are written down
#   3 fingerprint  - every landed file carries a SHA-256 and a knowledge time
#   4 sense        - duplicates, empty files, calendar gaps (quality/manifest_checks.py)
#   5 freshness    - up to the day it should reach (ingest/coverage.py)
#   6 quarantine   - none of its files is held (quality/quarantine.py)
#
# `name` is the dataset's row name in the Data coverage table, so the two
# pages agree. `tree` is its folder under data/landing/ when it has one.
# `min_grade` is the lowest integrity grade a backtest will run on.
#
# `licence: unreviewed` means nobody has read the source's terms for this use.
# It grades the dataset B at best until someone does and writes what they read.
#
# The addresses are the ones the ingest code fetches from (src/eulerlab/ingest/).

datasets:
  - name: Cash bhavcopy
    tree: nse
    segment: cm
    publisher: NSE
    url: https://nsearchives.nseindia.com
    licence: unreviewed
    knowledge_time: published after the close; usable from the next session's decision
    critical: true
    min_grade: C
    cross_check: make reconcile (bhavcopy against Kite minute bars)

  - name: F&O bhavcopy
