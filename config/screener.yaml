# The stock screener (ADR-136). OPERATOR-EDITABLE.
#
# Long-term and swing lists from models that have a stored backtest on the
# common engine. The six new models are in `backtest/screener_models.py`;
# `existing` are the platform's best stored daily strategies by Sharpe over
# 2016-2026 (strategy map, 2026-11-04), one per idea where they repeat.
# None has passed the gate; the page says so on every list.

existing:
  - {id: india_sharpe_momentum_opt, kind: long, title: "Sharpe momentum (tuned)"}
  - {id: nse_github_stocks_on_the_move, kind: long, title: "Stocks on the Move"}
  - {id: nse_github_weinstein_stage2, kind: long, title: "Weinstein stage 2"}
  - {id: india_physical_momentum, kind: long, title: "Physical momentum"}
  - {id: india_frog_in_the_pan, kind: long, title: "Frog in the pan"}

# Where each strategy's stored screening backtest is read from, in order.
summaries:
  - data/derived/screener_models.json
  - data/derived/topdown_screen.json
  - data/derived/india_papers.json
  - data/derived/github_daily.json
  - data/derived/evidence_daily.json

# The pre-registered choice (research 151, ADR-137): the long-term list is the
# fixed 70:30 blend; the swing list is the candidate with the best Sharpe in its
# worse half, ties to fewer parts, and none when no worse half reaches the floor.
# Changed 2026-11-04 by the operator: the 3-of-5 consensus (research 152).
# Changed 2026-11-08 by the operator (option A, research 182): Stocks on the Move,
# 21.5% a year 2016-2026, worst fall -29%, worse half 0.65 (the consensus: 0.48).
# Chosen after seeing the results, not by a pre-registered rule.
main_long: nse_github_stocks_on_the_move
swing_candidates:
  - screen_swing_mom_weinstein
  - screen_swing_breakout_weinstein
  - screen_swing_three
halves:
  - data/derived/screener_blends_2016_2020.json
  - data/derived/screener_blends_2021_2026.json
robust_floor: 0.5
