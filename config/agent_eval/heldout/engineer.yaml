# Held-out cases for the engineer role (ADR-183). No agent reads this file: read_document refuses
# config/, the knowledge index does not index it, and tests/test_agent_evals.py proves both.
role: engineer
cases:
- input:
    task: 'Make tests/test_runner.py pass: it fails after a change to src/eulerlab/deploy/runner.py.'
