# Language-model providers. Every one speaks the same OpenAI-compatible
# interface: POST {base_url}/chat/completions with {model, messages}.
#
# NO KEYS IN THIS FILE. `api_key_var` names an environment variable; the value
# lives in .env, which is gitignored. A key here would be a secret in the repo.
#
# The model does not decide anything. It drafts a strategy specification which
# is then validated by code, shown to you, and only run if you say so. A weaker
# model gives a worse first draft; it cannot give a wrong backtest result.
#
# # ASSUMPTION: the free tiers below are advertised by their providers and are
# # NOT verified here. Quotas change without notice. See docs/ASSUMPTIONS.md
# # (A-019). The only entry with genuinely no quota is `ollama`, because it runs
# # on your own machine.

default: ollama

# The in-app assistant (ADR-064). It sends your own numbers, so the code only
# accepts hosts whose data terms were read: openrouter.ai, api.groq.com, or a
# local model. On OpenRouter the code adds "zero retention, no data collection"
# to every request. Set to Groq's gpt-oss-120b on 2026-10-29 at the operator's
# request; the assistant and Research Library now offer only this model.
assistant: groq

# The paper agent (`make paper-agent`, ADR-084). Same locks as the assistant.
# Groq's `openai/gpt-oss-120b` is the strongest free model with a usable daily
# allowance whose data terms were read: 1,000 requests and 200,000 tokens a
# day, 8,000 tokens a minute (research 123, fetched 2026-10-29). If GROQ_API_KEY
# or the ZDR confirmation is missing, the agent says so and uses `assistant`.
research_agent: groq

# Pruned 2026-10-29 (research 123): `ollama-small` (a 3B model, too weak to
# draft a card), `openrouter-free` (a fixed llama-3.3 `:free` id with no ZDR
# lock), `openai` (paid, never used), and Groq's `llama-3.3-70b-versatile`,
# which Groq shut down on 2026-08-16.

providers:
  - name: ollama
    base_url: http://localhost:11434/v1
    model: qwen2.5-coder:7b
    free: true
    note: "Local. No key, no quota, nothing leaves the machine. Install from ollama.com, then `ollama pull qwen2.5-coder:7b`. The default for the strategy translator and the code audit when no provider is picked."
    temperature: 0.1

  - name: groq
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_var: GROQ_API_KEY
    free: true
    max_tokens: 4096
    note: "Hosted, free: 1,000 requests and 200,000 tokens a day, 8,000 tokens a minute (research 123). Turn on Zero Data Retention in its console and set EULERLAB_ASSISTANT_ZDR=1. Paid Developer plan raises the limits."
    temperature: 0.1

  - name: openrouter-private
    base_url: https://openrouter.ai/api/v1
    model: apodex/apodex-1.1-mini:free
    api_key_var: OPENROUTER_API_KEY
    free: true
    note: "Hosted, free, used by the assistant. The model is picked from OpenRouter's live zero-retention free list (ADR-080). 50 requests a day; 1,000 a day after a one-time $10 credit purchase (research 123)."
    temperature: 0.1
