summary: The authors ask which fundamental, market and macro variables explain the equity
  premium on the Indonesia Stock Exchange. They use a panel of 213 stocks from Jan 2007‑Dec 2014,
  running semester‑level panel regressions and monthly time‑series regressions. They find
  debt‑to‑equity, dividend payout, beta, price volatility and the exchange rate positively
  related to the premium, while inflation is negative; liquidity is insignificant.
trade_idea: Long stocks with higher debt‑to‑equity ratios, higher dividend payout ratios,
  higher beta and higher price volatility, and short those with low values, expecting the
  long side to earn a higher excess return; no explicit timing or cost analysis is provided.
