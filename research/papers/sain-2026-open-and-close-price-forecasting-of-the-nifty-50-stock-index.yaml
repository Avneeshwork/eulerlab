summary: The authors ask whether machine‑learning models can predict the next‑day open and
  close of the NIFTY 50 index. They use 5‑, 10‑ and 20‑year historical windows, compare raw
  OHLCV features to an augmented set with SMA, RSI, returns and volatility, and test 12 supervised
  regressors against a naïve persistence benchmark using chronological train‑test splits.
  They report MAE, RMSE and R², finding that simple linear models (Linear Regression, Ridge,
  Lasso) generalise best over longer windows, while tree‑based models (Random Forest, XGBoost)
  overfit short windows.
