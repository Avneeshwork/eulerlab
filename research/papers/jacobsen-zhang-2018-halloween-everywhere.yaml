summary: Stock returns from November to April exceed those from May to October by about 4.5
  points a year on average, in 89 of 114 markets (significant in 42), and by about 6.25 points
  over the last 50 years; a sell-in-May strategy beat the market over five-year horizons more
  than 80% of the time.
trade_idea: Equities earn their premium mostly in winter; holding cash through summer gives
  up little.
implementation: |-
