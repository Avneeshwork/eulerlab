summary: The authors ask whether industry‑specific factors can predict contrarian returns
  in South Asian emerging markets (India, Pakistan, Bangladesh). They use daily price data
  to form industry portfolios, rebalance them periodically, and compare returns across market
  regimes. They find a short‑term industry contrarian effect that is strongest during the
  Asian and global financial crises, while an industry momentum effect appears after the global
  crisis and during COVID‑19.
trade_idea: Go long stocks in industries that performed worst over the recent short‑term horizon
  and short stocks in industries that performed best, rebalancing regularly; the paper suggests
  this contrarian tilt yields higher returns, especially in crisis periods.
implementation: 'universe: Indian listed equities; data: daily price and industry classification;
  signal: average past short‑term return of each industry (e.g., 1‑month); entry: long stocks
  in bottom‑ranked industries, short stocks in top‑ranked industries; exit: rebalance at the
  chosen frequency; holding period: short‑term (approximately 1 month); sizing: equal‑weight
  within long and short legs; costs: unspecified (round‑trip intraday cost ~9 bps, delivery
  STT 0.1 % each side may apply).'
red_flags:
- The paper does not disclose the exact look‑back window or rebalance frequency, making the
  signal definition ambiguous.
- No transaction‑cost analysis is provided; realistic Indian round‑trip costs (≈9 bps intraday,
  0.1 % STT) could erode the reported contrarian premium.
- Results are driven by crisis periods (Asian/Global financial crisis, COVID‑19); regime‑dependence
  may limit out‑of‑sample performance.
