title: Comparative Evaluation of Deep Learning Architectures for Next-Day Stock Price Forecasting
  Using Technical Indicators
authors: Theofanis I. Aravanis, Andreas Kanavos
year: 2026
kind: paper
source_url: https://www.semanticscholar.org/paper/ad9834c69179d84a163575e728cfbef4b862c601
