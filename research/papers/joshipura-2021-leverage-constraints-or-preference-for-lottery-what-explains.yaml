summary: The authors ask why low‑risk (low‑beta) stocks earn higher returns in India. Using
  NSE data from Jan 2000 to Sep 2018 they construct a Betting‑against‑Correlation (BAC) factor
  to capture leverage‑constraint effects and an SMAX factor for lottery‑preference effects.
  They compare the explanatory power of each factor and find leverage constraints dominate.
trade_idea: Long stocks with the lowest systematic beta and short those with the highest beta,
  expecting the low‑beta side to outperform net of transaction costs.
