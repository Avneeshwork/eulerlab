summary: The author identifies Bull, Sideways, and Bear regimes in Indian equities (2019‑2025)
  with a Hidden Markov Model, then measures factor premia (momentum, market, value, etc.)
  within each regime. Momentum shines in Sideways, market in Bull, value in Bear. Daily foreign
  institutional investor (FII) gross volume predicts market returns only in Bear regimes,
  but the result is driven by the COVID period. A regime‑aware factor allocation yields a
  Sharpe of 0.794 versus 0.733 for a simple buy‑and‑hold over a 2021‑2026 walk‑forward sample.
trade_idea: Allocate to the factor that has the highest Sharpe in the currently identified
  regime (momentum in Sideways, market in Bull, value in Bear) and rebalance when the regime
  switches, expecting higher risk‑adjusted returns than a static portfolio.
implementation: unspecified
red_flags:
- Survivorship‑bias‑adjusted factor library may not reflect live tradable instruments.
- Bear regime sample is tiny (121 days) and dominated by the COVID crisis, limiting robustness.
- No transaction‑cost or capacity analysis is provided; Indian intraday costs (~9 bps) could
  erode the modest Sharpe gain.
- Regime detection relies on a Hidden Markov Model whose parameters may overfit the 2019‑2025
  sample.
