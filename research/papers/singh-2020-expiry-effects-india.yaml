id: singh-2020-expiry-effects-india
title: 'Re-examining the Expiration Effects of Index Futures: Evidence from India'
authors: Singh, G., Shaik, M.
year: 2020
kind: paper
source_url: https://pdfs.semanticscholar.org/49b6/32f8249aceae99d1eff1294284e5b194b9f2.pdf
pdf: ''
added: '2026-10-06'
status: specified
markets:
- Nifty futures, 2013-2019
summary: Compares Nifty futures returns, volume and volatility on expiry days, weeks and months
  against non-expiry periods, 2013-2019, split at the 2016 launch of Bank Nifty weekly options.
  Volume is significantly higher around expiry; return differences are never significant.
trade_idea: Unwinding and rollover around expiry could move prices; the paper finds it moves
  volume, not returns.
implementation: |-
  - Expiry day = last Thursday of the month; compared with the first two Thursdays.
  - t-tests, Wilcoxon and Kruskal-Wallis. No trading rule.

  Here: india_expiry_day holds NIFTYBEES over the monthly expiry day only (last Thursday, last Tuesday from September 2025).
red_flags:
- The paper finds no significant return effect; this is a test of a null result.
- 37 expiries per sub-period; the expiry weekday and the number of weekly expiries have changed
  since.
- Traded on NIFTYBEES, the Nifty 50 ETF, as the investable stand-in for the index studied.
reported_results: Expiry-day mean return post-2016 0.12% vs -0.07% on comparison days (p 0.24);
  volume significantly higher (p < 0.01).
