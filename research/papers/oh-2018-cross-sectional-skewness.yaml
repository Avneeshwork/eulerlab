summary: The authors ask whether observed cross‑sectional skewness of monthly stock returns
  matches the predictions of a standard lognormal model. Using monthly return data across
  many stocks they compare empirical skewness to model expectations, finding excess skewness
  in the cross‑section and a shortfall in long‑run returns, and propose an alternative model
  where idiosyncratic risk drives growth.
