summary: The authors examine the Hang Seng Shanghai‑Hong Kong Stock Connect A/H Premium Index
  (2016‑2025), linking liquidity, investor composition, and passive fund flows to premium
  dynamics. They find that higher short‑window A/H trading‑volume ratios often coincide with
  a widening cross‑sectional premium, and that monitoring Amihud illiquidity, bid‑ask spreads,
  and volume depth can signal convergence or re‑differentiation phases.
trade_idea: When the short‑window A/H trading‑volume ratio rises sharply, the cross‑sectional
  premium tends to widen; a trader could go long the under‑priced side (A‑shares) and short
  the over‑priced side (H‑shares) to capture the convergence.
