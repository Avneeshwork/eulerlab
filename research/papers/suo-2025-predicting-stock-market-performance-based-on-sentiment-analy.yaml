summary: The authors ask whether off‑hours social‑media sentiment can forecast a stock's opening
  price. They collect investor comments on Chinese financial platforms for Kweichow Moutai,
  compute a sentiment index (average score, positive ratio, volatility), and combine it with
  technical market data and macro indicators. A dual‑channel LSTM model processes technical
  features in one channel and sentiment features in the other. They report that the sentiment
  channel adds significant predictive power for the next‑day opening price, especially in
  rising markets and when using high‑frequency sentiment updates.
trade_idea: If overnight sentiment is high, go long at the market open; if sentiment is low,
  go short (or stay flat) expecting the opening price to move in the direction indicated by
  the sentiment signal.
