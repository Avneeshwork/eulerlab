summary: The author examines a 52‑week‑high momentum strategy on Finnish stocks using monthly
  data from Jan‑1998 to Sep‑2019, compares it to individual stock and industry momentum, and
  checks for short‑ and long‑term reversals. The 6‑month holding version yields significant
  positive returns, especially when January returns are excluded, though it is outperformed
  by pure stock momentum.
trade_idea: Buy stocks that are close to their 52‑week high (high price_to_52w_high) and hold
  for six months; returns appear positive in the Finnish market, particularly when January
  is omitted.
