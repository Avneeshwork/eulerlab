summary: 'Question: Does the liquidity premium change over time due to long‑run risk exposures?
  Data: US equity returns and liquidity measures from 1964‑2023, split pre‑ and post‑2000.
  Method: Estimate factor loadings of liquid vs illiquid portfolios to long‑run consumption
  and investment risk factors. Findings: Illiquid stocks have larger positive exposures to
  both factors before 2000, generating a positive liquidity premium; after 2000 the consumption‑risk
  exposure turns negative, reducing the premium.'
trade_idea: Long the most illiquid stocks (high Amihud illiquidity) to capture a liquidity
  premium that was historically positive before 2000 and may be weaker or absent after 2000.
