status: specified
markets:
- US stocks (NYSE, AMEX, NASDAQ), 1963-1998
summary: 'Splits each characteristic into a within-industry part (the firm against its industry
  average) and an across-industry part. Each is priced within industry, and the within-industry
  measure predicts more precisely than the raw one.'
trade_idea: Judge cheapness against a stock's own industry peers, not the whole market.
implementation: |-
  Here: screen_topdown_discount, earnings yield less its industry median (sector median when the
  industry has fewer than 3 liquid members), blended with Sharpe momentum inside the top 5 sectors
  (research 182).
red_flags:
- Read from a search summary of the abstract; the PDF was not read (research 182).
- US evidence only; no Indian test found.
- Industry tags are today's (A-128).
reported_results: 'Reported: within-industry book-to-market, cash flow-to-price and momentum are
  reliably priced.'
