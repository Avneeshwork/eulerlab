summary: The ratio of a stock's 21-day to its 200-day moving average predicts cross-sectional
  returns, with value-weighted hedge alphas near 9% a year, beyond momentum and the 52-week
  high, also internationally. Attributed to underreaction to deviations from price anchors.
trade_idea: Stocks trading well above their long-run anchor keep drifting up.
