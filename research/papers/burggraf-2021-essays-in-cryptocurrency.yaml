summary: The dissertation studies several crypto topics; one essay tests whether low‑volatility
  cryptocurrencies earn higher risk‑adjusted returns than high‑volatility ones using portfolio
  sorting and cross‑sectional regressions. It finds a persistent low‑volatility outperformance
  after controlling for liquidity and size.
trade_idea: Long the most low‑volatility cryptocurrencies (as measured by recent return dispersion)
  and avoid or short the high‑volatility ones, expecting higher risk‑adjusted returns.
