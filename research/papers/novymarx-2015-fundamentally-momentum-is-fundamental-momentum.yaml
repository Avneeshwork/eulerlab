summary: The authors ask whether firm‑level earnings momentum explains price momentum performance.
  Using cross‑sectional regressions of stock returns on earnings‑surprise measures and price‑momentum
  signals, they find earnings momentum fully accounts for the time‑series returns of price‑momentum
  strategies. Controlling for earnings surprises cuts price‑momentum performance, while controlling
  for past price performance reduces earnings‑momentum volatility and eliminates crash risk.
trade_idea: Long stocks with strong positive earnings surprises (earnings momentum) and short
  those with negative surprises; the expected excess return stems from the systematic component
  of price momentum that is driven by fundamentals.
