id: chui-2023-momentum-reversals-liquidity-india
title: 'Momentum, reversals and liquidity: Indian evidence'
authors: Chui, A., Ranganathan, K., Rohit, A., Veeraraghavan, M.
year: 2023
kind: paper
source_url: https://ideas.repec.org/a/eee/pacfin/v82y2023ics0927538x23002640.html
pdf: ''
added: '2026-10-06'
status: specified
markets:
- BSE stocks, 2000-2021
summary: Across 3,956 BSE stocks, 2000-2021, finds significant intermediate and long-term
  momentum that is stronger and lasts up to 12 months in highly liquid portfolios; short-term
  reversals appear only among illiquid stocks and do not persist.
trade_idea: 'Momentum is a liquid-stock phenomenon in India: buy liquid winners.'
implementation: |-
  - Momentum double-sorted by turnover ratio; formation and holding grid not stated in the abstract.

  Here: india_liquid_winners holds the more liquid half (median rupee turnover) of the top 30% by 6-month return, monthly.
red_flags:
- 'Abstract only: SSRN and the journal blocked the full text, so the formation length, portfolio
  size and weighting run here are assumptions, stated in the implementation.'
- Turnover ratio needs shares outstanding; rupee turnover is used instead, which also tracks
  size.
- Contradicts Aziz & Ansari (2014).
- Run long only on the 250 most-traded stocks as of each decision date, equal-weighted.
reported_results: 'Qualitative: significant momentum, greater and persisting 12 months in
  highly liquid portfolios.'
hypothesis: ''
