summary: The authors ask whether a hybrid CNN‑LSTM model can better forecast daily closing
  prices of HDFC Bank on the NSE. They use 247 trading days (9 Feb 2025‑9 Feb 2026) with added
  intraday volatility and VWAP, a 20‑day sliding window, and an 80/20 chronological train‑test
  split. They compare three architectures (CNN, LSTM, CNN‑LSTM) against a random‑walk baseline.
  The hybrid achieves RMSE 0.0228, MAE 0.0190, R² 0.312 and ~87 % validation accuracy, outperforming
  the baselines.
