summary: The authors decompose the price‑to‑52‑week‑high ratio into a price‑change component
  and an updating‑component (movement of the 52‑week high itself). They build two momentum
  portfolios that isolate each component and use portfolio returns and Fama‑MacBeth regressions
  to assess profitability. They find that removing the price‑change part (i.e., focusing on
  the updating component) raises momentum profits, and that a downward update of the 52‑week
  high makes the subsequent winner momentum stronger.
trade_idea: Long stocks whose price‑to‑52‑week‑high ratio is high because the 52‑week high
  has recently moved down (a negative updating event), expecting an enhanced short‑term momentum
  gain.
