summary: 'A SEBI study released on 24 July 2024, covering clients of the ten largest brokers.
  Reported: more than 70% of individual intraday traders in the cash segment lost money in
  FY 2022-23; the average loss was Rs 5,371; loss-makers spent a further 57% of their losses
  on trading costs. Known from press coverage; SEBI''s document was not fetched, and the link
  is to that coverage.'
trade_idea: 'None. It is the base rate: most intraday trading in Indian stocks loses, and
  costs are a large part of why.'
