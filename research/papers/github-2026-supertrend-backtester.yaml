trade_idea: Supertrend trails price by a volatility band; staying long while it points up
  rides trends and cuts reversals.
implementation: |-
  - Repository: app.py compute_supertrend (simple-mean ATR, hl2 +/- 2.2 ATR, carried final bands).

  Here: nse_github_supertrend_10_22 holds up to 20 of the point-in-time 250 most-traded stocks while each points up; the engine fills at the next close, not the next open.
