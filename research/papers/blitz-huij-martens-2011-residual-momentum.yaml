summary: Ranking on stock-specific (residual) returns, scaled by their volatility, gives momentum
  profits about twice as large on a risk-adjusted basis as total-return momentum, more consistent
  and less exposed to crashes.
trade_idea: Momentum that is not just market or factor exposure persists.
