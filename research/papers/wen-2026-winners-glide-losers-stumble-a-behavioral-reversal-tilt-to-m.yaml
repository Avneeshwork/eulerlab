summary: The authors ask whether the short leg of cross‑sectional momentum can be improved
  by accounting for the most recent month’s gross return. Using a century of US common‑stock
  data and twelve international markets, they compute a factor equal to classic skip‑month
  momentum multiplied by (1+ last‑month return). They find the factor outperforms standard
  momentum, with the outperformance coming entirely from the short side, and report a tradable
  gross premium of roughly 1–2% per year in shortable small‑to‑mid‑cap stocks.
trade_idea: Long the top momentum winners as usual, but short the bottom momentum losers after
  scaling each loser’s weight by (1+ its last‑month return); the short‑leg tilt is expected
  to capture rebound‑related reversals and generate a modest net alpha of about 1–2% annualized.
implementation: |-
  universe: shortable US small‑to‑mid‑cap stocks (e.g., market cap below the top 70% of the market)
  data: monthly total returns (including dividends) for each stock; daily price data for execution
  signal: factor = skip‑month 12‑month momentum × (1 + last‑month gross return)
  entry: rank stocks by the factor each month; go long top N and short bottom N
  exit: rebalance monthly (approximately every 21 trading days)
  holding period: 1 month
  sizing and costs: equal‑weight long and short legs; assume 9 bps round‑trip cost for intraday equity trades and 0.1 % STT for delivery trades; other transaction costs unspecified
red_flags:
- The reported 1–2% premium is gross of realistic Indian/US transaction costs and may disappear
  after applying 9 bps intraday or 0.1 % STT fees.
- The study focuses on small‑to‑mid‑cap stocks where liquidity can be thin; capacity may be
  limited and turnover constraints are not quantified.
- The sample spans a century, mixing many market regimes; the effect may be regime‑dependent
  and could have weakened in recent decades, raising survivorship bias concerns.
