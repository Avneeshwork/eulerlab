trade_idea: Dealers hedging options exposure trade in the direction of the day's move into
  the close, so a strong open predicts the last half hour.
implementation: |-
  Unknown: the paper was not readable. The template it reportedly adapts (Gao, Han, Li and Zhou 2018) goes long or short the index at the last half hour by the sign of the return from the previous close to 30 minutes after the open.

  Not backtested here until the paper itself is read.
red_flags:
