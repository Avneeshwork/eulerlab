summary: The authors ask whether volatility‑based behavioural anomalies exist in the Indian
  stock market. They analyse daily returns of Nifty and small‑cap stocks using GARCH, EGARCH
  and CGARCH models. They find persistent herding, a low‑volatility anomaly where low‑volatility
  stocks earn higher returns, and long‑ and short‑run volatility persistence.
trade_idea: Long stocks with the lowest recent volatility (e.g., low EGARCH conditional variance)
  and avoid or short high‑volatility stocks, expecting the low‑volatility anomaly to generate
  excess returns.
