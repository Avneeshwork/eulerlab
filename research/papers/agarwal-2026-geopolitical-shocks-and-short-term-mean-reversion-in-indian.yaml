id: agarwal-2026-geopolitical-shocks-and-short-term-mean-reversion-in-indian
title: 'Geopolitical Shocks and Short-Term Mean Reversion in Indian Equity Markets: Evidence
  from Four Event Studies'
authors: Reyaansh Agarwal
year: 2026
