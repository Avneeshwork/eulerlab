summary: The authors examine whether the Indian fear gauge (VIX) and its underlying index
  (Nifty 50) exhibit a day‑of‑the‑week effect. Using daily data they compare returns and volatility
  across weekdays, looking for consistent patterns. They find evidence that certain weekdays
  have higher (or lower) VIX levels and associated market returns.
trade_idea: If VIX is consistently higher on a particular weekday (e.g., Monday) and lower
  on another (e.g., Friday), a trader could buy VIX futures at the open of the high‑VIX day
  and close at the low‑VIX day, capturing the predictable spread.
implementation: 'universe: VIX futures (or index futures) on the Indian market; data: daily
  VIX and Nifty levels; signal: day‑of‑week dummy (e.g., Monday = 1, else = 0); entry: long
  VIX futures at market open on the identified high‑VIX weekday; exit: close position at market
  close on the identified low‑VIX weekday; holding period: 1‑4 days (unspecified); sizing:
  unspecified; costs: round‑trip intraday cost ≈9 bps for large stocks (apply similarly to
  futures) and 0.1 % STT per side for delivery trades (if used).'
