summary: 'Turtle rules on stock dailies: enter above the 20-day high, exit below the 10-day
  low or 2 ATR under entry, ATR-sized units with up to four adds. 51 stars; no licence stated.'
trade_idea: Breakouts to new highs continue often enough that cutting losers quickly leaves
  a positive trend-following edge.
implementation: |-
  - Repository: D1 = 20 entry channel, Ds = 10 exit channel, 2 x ATR stop, unit_limit = 4 (TurtleTrading.py).

  Here: nse_github_turtle_20_10 runs one unit per name (no pyramiding, no ATR sizing) on the point-in-time 250 most-traded NSE stocks, up to 20 names.
