summary: A November 2025 follow-up to Heston, Korajczyk and Sadka (2010). Reported to find
  that the same-time-of-day continuation in stock returns persists out of sample, and to attribute
  the pattern at the open to VWAP-style trading and at the close to market-on-close orders.
  Known from a search summary only; first names not confirmed.
trade_idea: Institutions execute at the same time each day, so a stock's return at a given
  time of day repeats on later days.
implementation: |-
  Not known beyond the 2010 paper's rule: sort stocks on one half-hour's return and hold the same half-hour on later days.

  Here: not coded. Research 077. The 2010 rule is specified as H-0008.
