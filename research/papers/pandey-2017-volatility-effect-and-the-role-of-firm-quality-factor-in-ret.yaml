summary: The authors ask whether volatility predicts returns in India using daily data for
  493 BSE‑500 stocks from Mar 2000 to Nov 2013; they sort stocks by volatility and compare
  returns; they find high‑volatility stocks significantly outperform low‑volatility ones and
  that a firm‑quality factor (cash‑flow variability) helps explain the pattern.
trade_idea: Long the most volatile stocks (and optionally short the least volatile) to capture
  the reported volatility premium.
implementation: |-
  universe: BSE‑500 constituents (Indian equities)
  data: daily adjusted close, volume, turnover
  signal: feature: "ts_std(ret(1),63)" (63‑day rolling standard deviation of daily returns)
  entry: rank_and_hold: go long top N most volatile stocks, equal‑weighted
  exit: unspecified
  holding period: unspecified (paper does not state)
  sizing: equal weight per stock
  costs: round‑trip intraday ≈9 bps, delivery STT 0.1 % each side (if using delivery trades)
red_flags:
- The sample ends in 2013, so regime change after 2013 may invalidate the effect.
- The study does not account for transaction costs; 9 bps round‑trip plus 0.1 % STT could
  erode the premium.
- Only BSE‑500 stocks are used, introducing survivorship bias and limiting capacity for high‑turnover
  volatility trades.
