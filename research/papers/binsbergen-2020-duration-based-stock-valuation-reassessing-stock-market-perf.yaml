summary: 'Question: Do bond portfolios that match the duration of dividend strips of a stock
  market index outperform the index? Data: International government bond returns and dividend
  strip estimates for major equity indices over ~50 years. Method: Construct fixed‑income
  portfolios with the same duration as the dividend strip cash flows and compare returns and
  volatility to the corresponding equity index. Findings: Duration‑matched bond portfolios
  have similar or higher returns and comparable or higher volatility than the equity indices.'
trade_idea: 'Not a testable trading idea: The paper studies aggregate index‑level duration‑matched
  bond portfolios versus equity indices, not a specific, testable trading signal for Indian
  or US equities/options.'
