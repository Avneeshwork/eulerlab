summary: 'The authors ask how macro‑energy demand shocks and EV market penetration affect
  Indian automotive firms'' profitability. They use monthly data (2022‑2026) with a Newey‑West
  time‑series estimator for aggregate demand elasticities, and a fixed‑effects panel on 10
  major Indian auto manufacturers with clustered SEs. Findings: Brent price changes do not
  predict domestic retail metrics (F=0.89, p=0.4166) and have no contemporaneous margin impact;
  higher EV penetration is associated with a negative margin effect (β=‑2.49, p=0.107), suggesting
  a J‑curve of front‑loaded costs.'
trade_idea: 'Not a testable trading idea: The paper analyzes corporate profit margins and
