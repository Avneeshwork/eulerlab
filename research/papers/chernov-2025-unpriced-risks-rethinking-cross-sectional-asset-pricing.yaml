summary: The authors argue that characteristic‑based factor returns contain large unpriced
  components that lower Sharpe ratios. They decompose factor returns into priced (mean‑variance
  efficient) and unpriced parts, show how hedging the unpriced part can realign factors with
  efficiency, and discuss practical hedge‑portfolio construction for equities, currencies,
  and sovereign bonds.
