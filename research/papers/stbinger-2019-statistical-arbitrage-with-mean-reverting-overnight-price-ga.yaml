title: Statistical Arbitrage with Mean-Reverting Overnight Price Gaps on High-Frequency Data
  of the S&amp;P 500
authors: Stübinger, Johannes, Schneider, Lucas, Johannes Stübinger, Lucas Schneider
year: 2019
