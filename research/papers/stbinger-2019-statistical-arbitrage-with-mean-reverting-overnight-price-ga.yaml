markets:
- US equities (S&P 500 constituents), 1998‑2015
summary: The authors ask whether overnight price gaps in S&P 500 stocks revert during the
  early trading session. They use high‑frequency (minute) data for all S&P 500 constituents
  from Jan 1998 to Dec 2015, apply a jump‑test to detect gaps, and trade the identified stocks
  in the first minutes after the market opens. Back‑tests report annualised returns of 51.47 %
  and a Sharpe of 2.38 after transaction costs, outperforming comparable strategies.
trade_idea: Trade the stocks that exhibit a statistically significant overnight price gap,
  entering shortly after the open and exiting after the gap mean‑reverts (approximately within
  the first two hours). The mean‑reversion provides a short‑term directional edge.
implementation: |-
  universe: S&P 500 constituents (as of each trading day)
  data: minute‑level price data (Jan 1998‑Dec 2015)
  signal: overnight price gap identified by a jump‑test
  entry: buy (or short) at market open based on the gap direction
  exit: close position after the gap mean‑reverts, typically within 120 minutes of open
  holding_period: up to 120 minutes after market open
  sizing: unspecified
  costs: transaction costs are included in the reported Sharpe, but exact cost assumptions are unspecified
red_flags:
