summary: The authors ask whether socially responsible (SR) institutions’ lower reaction to
  quantitative mispricing signals alters stock return patterns. Using institutional ownership
  data and standard mispricing metrics, they compare abnormal returns of stocks held more
  by SR institutions versus others. They find that abnormal returns to mispricing signals
  are larger for stocks with higher SR ownership, especially in recent years and when arbitrage
  funding is constrained.
trade_idea: Long stocks that have high SR institutional ownership and exhibit a strong undervaluation
  (or other mispricing) signal, expecting the reduced attention from SR investors to let the
  mispricing persist and generate excess returns.
