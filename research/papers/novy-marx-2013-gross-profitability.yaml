summary: Gross profits over assets predict returns about as well as book-to-market; profitable firms earn
  more despite looking expensive, and controlling for profitability strengthens value strategies.
trade_idea: 'Combine profitability with value: buy cheap and profitable firms.'
implementation: Screener.in has no gross profit; operating profit over total assets is the proxy.
red_flags:
- 'Operating profit is not gross profit: a weaker proxy.'
- US sample; India untested here.
