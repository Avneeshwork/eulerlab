summary: The study finds deeper levels of the NSE limit order book contribute to short-term return predictability beyond best prices, return autocorrelation, volume, and trade imbalance.
trade_idea: Use multi-level bid and ask depth to forecast short-horizon price direction and trade only when predicted movement exceeds spread and costs.
