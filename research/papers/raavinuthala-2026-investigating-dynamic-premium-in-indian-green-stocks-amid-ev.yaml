summary: 'Question: Do Indian green stocks earn a premium over market expectations? Data:
  Indian green‑stock returns, Fama‑French factors, liquidity measures, covering pre‑ and post‑COVID
  periods. Method: CAPM extended with Fama‑French and liquidity factors; ADCC‑GARCH to model
  time‑varying covariances; structural break test. Findings: A break on 21 Sep 2020; market
  betas rise after COVID; green‑stock illiquidity becomes more correlated with market illiquidity;
  Jensen''s alpha remains insignificant, indicating no abnormal performance.'
