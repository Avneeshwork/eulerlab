summary: Tests month-of-year effects on Nifty and Nifty Junior, 1997-2009, finding a December
  effect (with January, July and September once ARMA-corrected) and no April tax-year effect.
trade_idea: Indian stocks rise in December.
implementation: |-
  - Monthly log returns on 11 month dummies, May as base; ARMA terms added.

  Here: india_december holds NIFTYBEES in December only.
