  index funds.
trade_idea: Stocks that beat the market without volatility keep doing so.
implementation: |-
  - Jensen's alpha from a year of daily returns (Nifty 50, MIBOR); volatility from a year of daily returns; equal-weight percentile blend; weights tilt free-float caps, capped 5%.

  Here: india_alpha_low_volatility_30, 150 most-traded, risk-free zero, equal weights, every 126 sessions.
