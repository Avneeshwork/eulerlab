summary: 'Question: How does replacing turnover tax with VAT affect firm behavior? Data: Chinese
  service and manufacturing firms before and after a tax reform. Method: Natural experiment
  comparing affected service industries to unchanged manufacturing sectors. Findings: The
  reform boosted sales, R&D, and employment in service firms, driven by increased outsourcing
  from smaller, less innovative manufacturers; overall innovation quality improved.'
