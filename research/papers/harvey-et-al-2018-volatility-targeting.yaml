id: harvey-et-al-2018-volatility-targeting
title: The Impact of Volatility Targeting
authors: Harvey, C. R., Hoyle, E., Korgaonkar, R., Rattray, S., Sargaison, M., Van Hemert,
  O.
year: 2018
kind: paper
source_url: https://doi.org/10.3905/jpm.2018.45.1.014
pdf: ''
added: '2026-10-18'
status: specified
markets:
- US and global equities, bonds, credit, commodities, currencies
summary: Scaling exposure inversely to recent volatility raises Sharpe ratios for risk assets
  such as equities and credit, and reduces the likelihood of extreme returns, because volatility
  clusters and is negatively related to returns there.
trade_idea: Hold less of the index when it has been volatile; volatile spells come before
  the worst falls.
implementation: |-
  - Exposure = target volatility / recent volatility.

  Here: india_volatility_target_nifty, weight = min(1, 3-year / 1-month daily volatility of NIFTYBEES), the rest in LIQUIDBEES, monthly.
red_flags:
- The paper's target is fixed and leverage allowed; here capped at 1 with the index's own
  long-run volatility as target.
- Paper not fetched this session; summary from memory of its abstract.
