summary: The author back‑tests three strategies—20/50 EMA crossover, 50/200 EMA crossover,
  and buy‑and‑hold—on two Indian stocks, several Indian indices, the US S&P 500, and two commodity
  futures over July 2021‑July 2026, using Excel. The main finding is that Gold Futures under
  the 20/50 EMA strategy outperformed buy‑and‑hold despite a win‑rate below 50%, due to a
  few large wins and many small losses.
