id: ramraj-2025-permutation-trees-india
title: Predicting Stock Prices using Permutation Decision Trees and Strategic Trailing
authors: Ramraj, V., Nagaraj, N., Harikrishnan, N. B.
year: 2025
kind: paper
source_url: https://arxiv.org/abs/2504.12828
pdf: ''
added: '2026-10-07'
status: rejected
markets:
- Nifty 50 stocks, 5-minute bars, 3 months
summary: Uses a Permutation Decision Tree with Effort-To-Compress split gain on seven
  candle-derived features and predicts whether the close 50 five-minute bars ahead will
  exceed the current close. The paper reports 1.18% average PDT portfolio growth over a
  roughly three-month Nifty 50 test, versus -2.29% buy-and-hold.
trade_idea: Long when the trained PDT forecasts a higher close 50 five-minute bars later;
  exit on a 0.5% trailing close stop or when the model prediction turns zero.
implementation: |-
  Audit of the linked paper and author code is in docs/RESEARCH/099-permutation-tree-paper-audit.md.
  The headline result is rejected as evidence of an intraday edge: the released split
  leaves training labels whose 50-bar outcomes cross into the test period, signals and
  fills at the same close, and the forecast horizon may cross sessions. The released
  execution code also does not implement an intraday square-off. No local backtest was
  run because the published result cannot be compared fairly under these defects and
  no post-2024-11-30 prices may be read.
red_flags:
- The full paper and author code are available; the earlier abstract-only catalog note was wrong.
- Three-month test period and no transaction costs or slippage.
- Split code trains through index split-1 even though the final 50 training labels use closes in the test period; removing the first 50 test rows does not purge those training labels.
- A prediction computed from a bar's close is executed at that same close.
- Fifty 5-minute bars are not an intraday horizon and can extend across sessions; code carries positions instead of forcing a daily square-off.
- Paper specifies a 0.5% trailing stop, but reported execution results are not reproducible evidence of net profitability.
reported_results: PDT +1.1802%, LSTM +0.557%, RNN +0.5896%, buy-and-hold -2.29% over the paper's short test sample, before costs.
hypothesis: ''
strategies: []
