# Installed by `make install`. These run on commit; the same checks run in CI,
# so a hook that passes locally is a commit that passes CI.

# The three documents below are operator-supplied reference material. They are
# read-only source, not our prose — no hook may rewrite them, not even to strip
# a trailing space.
exclude: '^docs/(quant_platform_playbook|AI_BUILD_PLAN|sprint_01_kickoff)\.md$'

# `make install` installs all three. The commit hook stays under ~20 seconds so
# nobody has a reason to pass --no-verify; the full test suite runs on push and
# in `make check` (ADR-161). post-commit logs any commit the hooks never saw.
default_install_hook_types: [pre-commit, commit-msg, pre-push, post-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The docs gate runs in CI and in `make verify`, but both are easy to bypass
  # by committing without looking. Twice on 2026-08-18 a src/ change was
  # committed with no docs because `make verify` and `git commit` were run as
  # separate commands and the red table scrolled past. Enforcing it here makes
  # the commit itself fail, which is the only check that cannot be skipped by
  # inattention.
  - repo: local
    hooks:
      - id: docs-check
        name: docs-check (src/ changes need docs)
        entry: uv run python tools/docs_check.py --staged-only
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # Local hooks. These are the gates that actually catch defects; running them
  # only in `make verify` means a commit can be made while they are red, which
  # happened twice on 2026-08-18.
  - repo: local
    hooks:
      # On commit, mypy checks the staged files (and what they import), so
      # another thread's half-written file cannot block this commit. The whole
      # tree is checked on push and in `make check` (ADR-161).
      - id: mypy
        name: mypy --strict (staged files)
        entry: uv run mypy
        language: system
        types: [python]
        files: ^(src|tools|tests)/
      - id: mypy-all
        name: mypy --strict (whole tree)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
      # The whole suite takes minutes and runs against the shared working
      # tree, so on commit it was the reason hooks were skipped (ADR-161). It
      # runs on push and in `make check` instead.
      - id: pytest
        name: pytest
        # Parallel, one worker per test file (ADR-196). SERIAL=1 git push runs
        # it in one process.
        entry: sh -c 'if [ -n "$SERIAL" ]; then uv run pytest -q; else uv run pytest -q -n auto --dist loadfile; fi'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
      - id: hygiene
        name: hygiene (no new dead code, duplicates or junk)
        entry: uv run python tools/hygiene.py --staged
        language: system
        pass_filenames: false
        always_run: true
      # git runs commit-msg only after every pre-commit hook passed, and
      # --no-verify skips both, so this records the tree the hooks approved.
      - id: hook-witness-mark
        name: hook witness (mark)
        entry: uv run python tools/hook_witness.py mark
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit-msg]
      - id: hook-witness-check
        name: hook witness (check)
        entry: uv run python tools/hook_witness.py check
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
