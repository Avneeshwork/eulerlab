# Installed by `make install`. These run on commit; the same checks run in CI,
# so a hook that passes locally is a commit that passes CI.

# The three documents below are operator-supplied reference material. They are
# read-only source, not our prose — no hook may rewrite them, not even to strip
# a trailing space.
exclude: '^docs/(quant_platform_playbook|AI_BUILD_PLAN|sprint_01_kickoff)\.md$'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The docs gate runs in CI and in `make verify`, but both are easy to bypass
  # by committing without looking. Twice on 2026-08-18 a src/ change was
  # committed with no docs because `make verify` and `git commit` were run as
  # separate commands and the red table scrolled past. Enforcing it here makes
  # the commit itself fail, which is the only check that cannot be skipped by
  # inattention.
  - repo: local
    hooks:
      - id: docs-check
        name: docs-check (src/ changes need docs)
        entry: uv run python tools/docs_check.py --staged-only
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # Local hooks. These are the gates that actually catch defects; running them
  # only in `make verify` means a commit can be made while they are red, which
  # happened twice on 2026-08-18.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]
