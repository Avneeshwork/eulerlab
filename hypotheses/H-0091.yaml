claim: 'Shorting the top decile and buying the bottom decile of yesterday''s put volume / (put + call volume) in the chosen expiry from 09:20 to 15:10 earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Pan and Poteshman (2006, RFS): low put-call ratios beat high by 40 bps the next day. Research 163.'
