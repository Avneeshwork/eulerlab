  data: 'data/landing/nse_reports (bulk_deals, sast, fo_ban, slbm), backfilled from 2021-07-01'
  costs: 'cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x'
  window: '2021-08-20 to 2024-11-29'
red_flags:
