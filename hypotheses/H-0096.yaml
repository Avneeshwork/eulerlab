claim: 'Shorting F&O stocks on the first trade date they enter the F&O ban list, 09:20 to 15:10, earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Broker explainers call the ban bearish because no new longs can be opened. Research 164.'
