id: H-0121
title: At 13:30, buy a pullback in a stock up 2.5% on a Nifty-up day (short the mirror), to 15:10
status: draft
family: intraday_stock_mft
source_kind: practitioner
parent: ''
claim: 'At 13:30, buy a pullback in a stock up 2.5% on a Nifty-up day (short the mirror), to 15:10: earns
  more than costs at Rs 5 lakh a trade in both halves of 2021-11 to 2024-10.'
rationale: H-0118's rule at 13:30 instead of 12:00.
source:
  research: '169'
  written_by: Claude, for the operator's request for ten more MIS-sized stock scalps after research 168
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  rule: 'at 13:30 among the 100 most traded stocks: up >= 2.5% from the previous close with the Nifty
    up, and the 13:30 close at least 0.5% below the day''s highest 5-minute close, buys; the mirror sells;
    the ten largest moves; from the next fill to 15:10'
  data: research 161's minute snapshots of the 416 F&O stocks (5-minute closes and next-minute fills,
    09:20 to 15:10); Nifty 50 index minutes; Nifty 50 daily closes for beta
  timeframe: 5-minute closes
  costs: cash intraday charges plus 2 bps a side; Rs 5 lakh a trade (Rs 1 lakh margin at Zerodha's 5x
    MIS), at most 10 open at once on Rs 10 lakh of margin; returns on the Rs 10 lakh
  window: 2021-11-01 to 2024-10-15
red_flags:
- 'A variant of H-0118 (PAPER), chosen because H-0118 passed: not independent evidence.'
- 'Written after research 168''s results were known: two rules there passed the paper bar, and ideas near
  them are flagged as such.'
- 'Ten more rules under the simple gate (no search correction): twenty scalps in all, so one or two passes
  are expected from noise alone.'
- Decisions and stops on 5-minute closes only; slippage of 2 bps a side assumed, not measured (T-4490).
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 2829 trades (3.89 a day), 15.41 bps gross and 6.94 net a trade at Rs 5 lakh
  (cost 8.47), net Sharpe 0.839, halves 0.871 / 0.807, drawdown -23% of margin; by year on margin 2021
  +3%, 2022 +44%, 2023 +6%, 2024 +34% (research 169). Gate 2026-11-07 (validate #104, gate #105): PAPER.
  Failed promotion on 2x costs (net Sharpe -0.19) and probabilistic Sharpe 0.927; paper bar passed. Daily
  returns correlate 0.57 with H-0118''s.'
