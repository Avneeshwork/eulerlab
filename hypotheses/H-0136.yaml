id: H-0136
title: 'Same-hour seasonality at the open: long the five stocks whose 09:20-10:20 return was highest over
  the last 20 sessions, short the lowest, 09:20 to 10:20'
status: rejected
family: intraday_stock_quant
source_kind: paper
parent: ''
claim: 'Same-hour seasonality at the open: long the five stocks whose 09:20-10:20 return was highest over
  the last 20 sessions, short the lowest, 09:20 to 10:20: earns more than costs at Rs 5 lakh a position
  in both halves of the window and at twice the costs.'
rationale: 'Heston, Korajczyk and Sadka (2010, JF): a stock''s return in a given half-hour repeats on
  following days in the same half-hour. H-0064 tested the 14:40-15:10 slot (dead).'
source:
  research: '170'
  written_by: Claude, for the operator's request for ten better-quality quant strategies after research
    169
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  rule: score = mean of (10:20 close / 09:20 close - 1) over the previous 20 sessions; rank the 100 most
    traded; long the five highest, short the five lowest; from the open after the 09:20 close to the open
    after the 10:20 close
  data: research 161's minute snapshots of the 416 F&O stocks (5-minute closes, next-minute fills, daily
    traded value); Nifty 50 daily closes for beta; today's NSE industry (A-112)
  timeframe: 09:20 decision on 5-minute snapshots
  costs: cash intraday charges plus 2 bps a side; Rs 5 lakh a position (Rs 1 lakh margin at Zerodha's
    5x MIS); five long and five short, ten open on Rs 10 lakh of margin; returns on the Rs 10 lakh
  window: 2021-11-01 to 2024-10-15 (H-0138 from 2022-09-01, when 250 sessions of history exist)
red_flags:
- Same idea as H-0064 at a different hour.
- 'Stricter screen fixed in advance (research 170): gated only if net positive in both halves AND at 2x
  costs.'
- Thirty scalps were tried before these; the simple gate does not correct for that search.
- The papers tested daily or monthly holding on US or Chinese stocks; this is a same-day version on NSE
  F&O stocks.
- Fills on 5-minute snapshots; 2 bps a side of slippage assumed (T-4490).
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 7280 trades (10.0 a day), 0.14 bps gross (long leg -7.29, short leg 7.58)
  and -8.32 net a trade at Rs 5 lakh; net Sharpe -2.532, halves -3.366 / -1.726, at 2x costs -5.107; drawdown
  -97% of margin; by year on margin 2021 -30%, 2022 -69%, 2023 -61%, 2024 -56% (research 170). Fails research
  170''s screen (both halves and 2x costs net positive); not gated.'
