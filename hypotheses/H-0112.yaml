id: H-0112
title: Every half hour, fade the most extreme 30-minute move against the Nifty among liquid stocks, hold
  30 minutes
status: rejected
family: intraday_stock_mft
source_kind: paper
parent: ''
claim: 'Every half hour, fade the most extreme 30-minute move against the Nifty among liquid stocks, hold
  30 minutes: earns more than costs at Rs 5 lakh a trade in both halves of 2021-11 to 2024-10.'
rationale: 'Da, Liu and Schaumburg (2014, Management Science): short-term reversal is in the residual,
  not the market part; intraday liquidity provision earns it.'
source:
  research: '168'
  written_by: Claude, for the operator's request for ten MFT-style stock scalps on minute data, 5-10 trades
    a day, Zerodha MIS leverage
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  kind: residual reversal
  rule: 'at 10:00, 10:30, ..., 14:30: residual = stock 30-minute return - beta x Nifty 30-minute return
    over the 100 most traded stocks; the single largest |residual| if >= 1.5%; trade against it from the
    next fill, exit 30 minutes later'
  data: research 161's minute snapshots of the 416 F&O stocks (5-minute closes and next-minute fills,
    09:20 to 15:10); Nifty 50 index minutes; Nifty 50 daily closes for beta
  timeframe: 5-minute closes
  costs: cash intraday charges plus 2 bps a side; Rs 5 lakh a trade (Rs 1 lakh margin at Zerodha's 5x
    MIS), at most 10 open at once on Rs 10 lakh of margin; returns on the Rs 10 lakh
  window: 2021-11-01 to 2024-10-15 (Nifty minutes start 2021-11-01; the last index file before the 2024-11-30
    cut ends 2024-10-15)
red_flags:
- Ten rules written together; under the simple gate (no search correction) about one in twenty pure-noise
  rules would pass at 5%, so a single pass among ten is weak evidence.
- Decisions and stops on 5-minute closes only (the snapshots keep no highs, lows or volume per bar); a
  real stop would trigger inside the bar.
- 2 bps a side of slippage is assumed for every stock in the liquid set, not measured (T-906, A-052).
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 4153 trades (5.7 a day), -0.37 bps gross and -8.84 net a trade at Rs 5 lakh
  (cost 8.47), net Sharpe -2.421, halves -2.617 / -2.21, drawdown -87% of margin; by year on margin 2021
  +5%, 2022 -44%, 2023 -54%, 2024 -47% (research 168). Fails the screen; not gated.'
