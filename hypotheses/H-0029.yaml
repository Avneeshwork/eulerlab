red_flags:
- The regime classification uses a Hidden Markov Model calibrated on 2019‑2025 data;
  a different calibration window could change regime timing, creating look‑ahead bias
  if not properly held‑out.
- The Sharpe improvement (≈0.06) is modest relative to Indian intraday round‑trip
  costs (~9 bps) and may be wiped out once realistic slippage and market impact are
  included.
- Capacity is unclear because the factor tilts may require large notional exposure
  to niche factor proxies, and Indian market depth may limit scaling, especially for
  momentum and value factor constructions.
