id: H-0029
title: Regime‑aware factor tilt outperforms static allocation in Indian equities
status: draft
claim: When daily regimes (Bull, Sideways, Bear) are identified via a Hidden Markov
  Model on Indian equity returns, a daily allocation that goes long the factor with
  the highest historical Sharpe in the current regime (momentum in Sideways, market
  in Bull, value in Bear) and holds a market‑neutral exposure to other factors yields
  a net Sharpe at least 0.05 higher than a buy‑and‑hold equity portfolio after Indian
  intraday transaction costs of 9 bps per round‑trip.
rationale: The paper documents that each factor’s premium is concentrated in a specific
  regime, and a regime‑aware allocation improves Sharpe from 0.733 to 0.794 in sample,
  suggesting a systematic edge.
