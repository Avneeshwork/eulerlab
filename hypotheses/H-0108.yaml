id: H-0108
title: Fade a stock's last-session move the session after NSE asks it to verify a news item, 09:20 to
  15:10
status: rejected
family: intraday_nse_queries
source_kind: practitioner
parent: ''
claim: On the first session after an NSE 'News Verification' clarification is disseminated outside market
  hours, trading F&O stocks against their last session's move (at least 2%), 09:20 to 15:10, earns more
  than costs in both halves of 2021-08 to 2024-11.
rationale: A news item NSE queried is often a rumour; the move it caused reverses once the company answers.
source:
  research: '167'
  written_by: Claude, for the operator's request to research stock day-trading after research 166
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  rule: 'event: ''News Verification'', disseminated before 09:15 or after 15:30; T = first session starting
    after it; move = last close of T-1 / last close of T-2 - 1; if |move| >= 2%, trade against it on T,
    09:20 to 15:10'
  data: data/landing/nse_announcements (2021-07 to 2024-12), timed by exchdisstime; fills from research
    161's minute snapshots (5-minute checkpoints)
  timeframe: 5-minute closes
  costs: cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x, at most ten a day, largest move first
  window: 2021-08-20 to 2024-11-29
red_flags:
- No academic study of NSE clarification queries was found; the prior is research 160 (news moves reverse)
  and attention-driven buying (Barber and Odean 2008).
- 'The four cards share one idea (fade a move NSE has queried): passing together is about one bet.'
- The dissemination time is when the company's reply is posted, which can be hours after NSE asked.
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 206 trades, 1.42 bps gross and -10.84 net a trade, net Sharpe -0.248; by year
  2021 -1.0%, 2022 -1.2%, 2023 +1.4%, 2024 -1.4% (research 167). Fails the screen; not gated.'
