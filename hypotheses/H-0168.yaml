id: H-0168
title: Fade a 3% opening gap on the morning after results, open to close
status: draft
family: stock_intraday_daily_all_nse
source_kind: paper
parent: ''
claim: 'Fade a 3% opening gap on the morning after results, open to close: earns more than costs in both
  halves of 2021-07-01 to 2024-11-29 and at twice the costs.'
rationale: 'Liu, Hope and Hu (2023): the intraday session trades against the overnight earnings reaction.
  H-0040 tested F&O stocks with minute fills (6.5 bps gross, dead).'
source:
  research: '176'
  written_by: Claude, for the operator's request to keep researching (half intraday, half swing, other
    data, 1x)
  day: '2026-11-07'
configurations:
- shape: daily_cash
  rule: results disclosed after the previous 15:30 and before 09:15 (nse_earnings_announcements); gap
    = open / previous close - 1, |gap| >= 3%; trade against the gap from the open to the close; largest
    gap first
  universe: the 500 most traded NSE stocks by 20-session traded value each day (price panel, research
    173); stocks in series BE/BZ the previous session skipped (research 174)
  costs: cash intraday charges plus 2 bps a side; Rs 1 lakh a position, 1x, at most ten a day; official
    open to official close
  window: 2021-07-01 to 2024-11-29
  data: price_panel.jsonl, delivery.jsonl, nse_reports (bulk_deals), nse_earnings_announcements
red_flags:
- 'Daily bars: the official open and close are auction prices standing in for 09:20 and 15:10 fills.'
- Raw prices; a window with a close ratio outside 0.6-1.6 is dropped as a likely corporate action (A-119).
- Seventy-three rules were tried before these; the simple gate does not correct for that search.
- 'Screen as research 170: gated only if net positive in both halves and at twice the costs.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07 (corrected code, HISTORY #84): 1,077 trades 2021-07 to 2024-11, 60.36 bps gross
  and +48.09 net a trade; net Sharpe 1.91, halves 0.73 / 2.80, 1.44 at 2x costs, 0.95 at 3x; every year
  positive (2021 +6%, 2022 +3%, 2023 +8%, 2024 +41%); drawdown -4.5% (research 176). Gate (validate #124,
  gate #125): PROMOTE, 9 of 9 (PSR 1.000). Strict-mode figures: deflated Sharpe 0.844, Romano-Wolf fails
  (0.20 vs 1.82); best five names removed keeps 78%. Superseded: the first screen and gate (validate #122,
  gate #123: PROMOTE on 176 trades, +90.21 bps net) ran code that skipped every results disclosure made
  after the close. Open-print check 2026-11-08 (research 180): on F&O stocks with minute data the edge
  is 45.9 bps gross from the official open but 1.2 from 09:20 to 15:10: it lives in the opening auction
  and is untested as a pre-open trade. Unproven.'
