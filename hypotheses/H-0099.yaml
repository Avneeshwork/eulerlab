id: H-0099
title: 'Leave the noise area on 15-minute closes: trade Nifty futures with the break, flat by 15:25'
status: rejected
family: intraday_index_futures
source_kind: paper
parent: ''
claim: On Nifty futures, going long when a 15-minute close is above the noise area's upper band and short
  below its lower band, flat inside it and at 15:25, earns more than futures costs in both halves of 2021-11
  to 2024-10.
rationale: 'Zarattini, Aziz and Barbon (2024/2025), read in full in research 071: the noise area had a
  stable gross edge on NIFTYBEES (Sharpe 1.58, about 3 bps a trade) that the ETF''s cash charges ate;
  T-4039 asked whether the cheaper future carries it.'
source:
  research: '166'
  written_by: Claude, for the operator's request for five minute-chart day-trading strategies on Indian
    markets
  day: '2026-11-07'
configurations:
- shape: intraday_index_futures
  rule: anchor = 09:15 minute close; sigma(t) = mean over the previous 14 sessions of |close(t)/anchor
    - 1|; upper = max(anchor, previous official close) x (1 + sigma), lower = min(anchor, previous official
    close) x (1 - sigma); at each 15-minute close from 09:45 to 15:00 the position becomes +1 above upper,
    -1 below lower, 0 between; fill at the next minute's open; flat at the 15:25 open
  data: kite_index_minute NIFTY50 one-minute bars, used as the near-month future's price (A-115)
  timeframe: 15-minute bars, filled on one-minute bars
  costs: costs.schedule futures rates on the day plus 1 bp a side slippage; Rs 10 lakh notional a trade,
    continuous units, 1x
  window: 2021-11-01 to 2024-10-15 (the last index file before the 2024-11-30 cut)
red_flags:
- The paper decides on 30-minute marks with a VWAP stop; the index has no volume, so this uses 15-minute
  marks and the band as the stop.
- 'The index is not the future: the basis moves a little inside the day and the future has a spread; both
  are assumed away (A-115).'
- Futures STT went from 0.0125% to 0.02% on 2024-10-01 and to 0.05% on 2026-04-01; a rule that clears
  2021-2024 costs may not clear today's (reported).
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 788 trades, 3.90 bps gross and -0.47 net a trade (costs 4.37), gross Sharpe
  1.81, net -0.21; first half net negative (research 166). Fails the screen; not gated.'
