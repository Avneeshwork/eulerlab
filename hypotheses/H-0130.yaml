id: H-0130
title: Buy yesterday's 3% winner after a 1% dip by 10:00, to 15:10 (and the mirror)
status: rejected
family: intraday_stock_mft
source_kind: practitioner
parent: ''
claim: 'Buy yesterday''s 3% winner after a 1% dip by 10:00, to 15:10 (and the mirror): earns more than
  costs at Rs 5 lakh a trade in both halves of 2021-11 to 2024-10.'
rationale: Practitioner 'buy the first dip' in a strong name.
source:
  research: '169'
  written_by: Claude, for the operator's request for ten more MIS-sized stock scalps after research 168
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  rule: 'among the 100 most traded stocks: yesterday''s close-to-close return >= 3% and the 10:00 close
    at least 1% below yesterday''s close buys from the next fill; the mirror sells; stop at the fill after
    a close 1% beyond the entry against the trade; else 15:10; at most ten, largest yesterday''s move
    first'
  data: research 161's minute snapshots of the 416 F&O stocks (5-minute closes and next-minute fills,
    09:20 to 15:10); Nifty 50 index minutes; Nifty 50 daily closes for beta
  timeframe: 5-minute closes
  costs: cash intraday charges plus 2 bps a side; Rs 5 lakh a trade (Rs 1 lakh margin at Zerodha's 5x
    MIS), at most 10 open at once on Rs 10 lakh of margin; returns on the Rs 10 lakh
  window: 2021-11-01 to 2024-10-15
