id: H-0110
title: Fade a stock's move from the next 5-minute close after NSE asks it to verify a news item during
  the session
status: rejected
family: intraday_nse_queries
source_kind: practitioner
parent: ''
claim: When an NSE 'News Verification' clarification is disseminated 09:20 to 14:30, trading the F&O stock
  against its move since the previous close (at least 2%) from the next 5-minute close to 15:10 earns
  more than costs in both halves of 2021-08 to 2024-11.
rationale: As H-0108, traded the same day.
source:
  research: '167'
  written_by: Claude, for the operator's request to research stock day-trading after research 166
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  rule: 'event: ''News Verification'', disseminated 09:20 to 14:30 on T; k = first 5-minute close at or
    after it; move = close at k / last close of T-1 - 1; if |move| >= 2%, trade against it from the open
    after k to 15:10'
  data: data/landing/nse_announcements (2021-07 to 2024-12), timed by exchdisstime; fills from research
    161's minute snapshots (5-minute checkpoints)
  timeframe: 5-minute closes
  costs: cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x, at most ten a day, largest move first
  window: 2021-08-20 to 2024-11-29
red_flags:
- No academic study of NSE clarification queries was found; the prior is research 160 (news moves reverse)
  and attention-driven buying (Barber and Odean 2008).
- 'The four cards share one idea (fade a move NSE has queried): passing together is about one bet.'
- The dissemination time is when the company's reply is posted, which can be hours after NSE asked.
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 148 trades, -4.17 bps gross and -16.42 net a trade, net Sharpe -0.664; by
  year 2021 +0.1%, 2022 -0.7%, 2023 -0.8%, 2024 -1.0% (research 167). Fails the screen; not gated.'
