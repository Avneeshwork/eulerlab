id: H-0067
title: 'Buy the stocks with the most frequent overnight-up, daytime-down days, short the fewest, 09:20 to 15:10'
status: draft
family: intraday_cash
source_kind: paper
parent: ''
claim: 'Ranking stocks each morning on how many of the previous 20 sessions had a positive overnight move followed by a negative daytime move, buying the top decile and shorting the bottom decile from 09:20 to 15:10 earns more than costs in both halves of 2021-09 to 2024-11.'
rationale: 'Akbas, Boehmer, Jiang and Koch (2022, JFE 145(3)): a more intense tug of war (frequent positive overnight returns reversed in the daytime) predicts higher future returns, as daytime arbitrageurs overcorrect. Replicated in the US and Canada; not in France, Germany, Italy, the UK, Japan or China. Research 159.'
source:
  research: '159'
  written_by: Claude, for the operator's request for five more strategies
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  strategy: 'nse_tug_of_war_intensity'
  universe: 'F&O stocks in the india-five cache with 20 prior sessions'
  signal: 'count of the previous 20 sessions with overnight > 0 and daytime < 0'
  long: 'top decile; short: bottom decile; ties broken by symbol; at least 100 ranked'
  entry: '09:20 open; exit: 15:10'
  costs: 'cash intraday plus 2 bps a side; ₹1 lakh a position, 1x'
  window: '2021-09 to 2024-11-29'
red_flags:
- 'The paper predicts monthly close-to-close returns; the daytime share of that is unknown and may be negative.'
- 'Counts take only 21 values, so deciles are cut through ties.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
