id: H-0152
title: 'Earnings premium: buy a liquid stock the session before its results, sell at the end of the reaction
  session'
status: rejected
family: stock_swing_other_data
source_kind: paper
parent: ''
claim: 'Earnings premium: buy a liquid stock the session before its results, sell at the end of the reaction
  session: earns more than costs in both halves of the window and at twice the costs.'
rationale: 'Frazzini and Lamont (2007), Barber et al. (2013): stocks earn a premium around scheduled earnings
  announcements, in most countries.'
source:
  research: '172'
  written_by: 'Claude, for the operator''s request: half intraday, half swing, other data as signals for
    stocks and the index'
  day: '2026-11-07'
configurations:
- shape: swing_cash
  rule: results disclosure time from nse_earnings_announcements; reaction session R = the first session
    that opens after the disclosure; buy at 09:20 on the session before the disclosure day, sell at 15:10
    on R; the 200 most traded; at most ten open, earliest first
  data: nse_earnings_announcements (2021-07 to 2024-12); minute snapshots
  costs: delivery (CNC) charges from costs.schedule plus 2 bps a side, 26.2 bps a round trip; Rs 1 lakh
    a position at 1x, at most ten open on Rs 10 lakh; long only (no overnight cash shorts)
  window: 2021-11-01 to 2024-10-15 (research 168's window; index minutes start 2021-11-01)
red_flags:
- 'Long only in a market that rose about 50% over the window: the report also gives the return over NIFTYBEES
  held the same days.'
- The board-meeting date is assumed public at least two working days ahead (A-111); entry is one session
  before the disclosure day.
- Fifty-three rules were tried before these; the simple gate does not correct for that search.
- Papers cited from memory and earlier notes, not re-fetched (research 172).
- 'Screen as research 170: gated only if net positive in both halves and at twice the costs.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 819 positions, -23.81 bps gross and -50.0 net each, net over NIFTYBEES -48.43
  bps; net Sharpe -1.014, halves -1.647 / -0.451, at 2x costs -1.548; drawdown -45%; by year 2021 +1%,
  2022 -22%, 2023 -22%, 2024 +6% (research 172). Fails research 170''s screen; not gated.'
