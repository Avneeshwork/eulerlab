id: H-0069
title: 'When the Nifty''s recent overnight gains are extreme, trade NIFTYBEES against them in the daytime'
status: draft
family: intraday_cash
source_kind: paper
parent: ''
claim: 'When the Nifty''s mean overnight move (prior close to 09:15 open) over the previous 20 sessions is in the top fifth of the previous 250 sessions'' values, shorting NIFTYBEES from 09:20 to 15:10, and when in the bottom fifth buying it, earns more than costs in both halves of 2022-11 to 2024-11.'
rationale: 'The market-level form of the cross-period reversal (Lou, Polk and Skouras 2019) that made 13.9 bps gross across stocks (H-0065); the US equity premium is earned overnight (Cliff, Cooper and Gulen 2008). Research 159.'
source:
  research: '159'
  written_by: Claude, for the operator's request for five more strategies
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  strategy: 'nifty_overnight_extreme_niftybees'
  signal: 'mean of the previous 20 Nifty overnight moves (kite_index_minute: prior session''s last close to the 09:15 open); its rank among the previous 250 such means; >= 80th -> short, <= 20th -> long'
  entry: '09:20 open; exit: 15:10'
  costs: 'cash intraday as for a share plus 2 bps a side; NIFTYBEES ₹10 lakh, 1x'
  window: '2022-11 to 2024-11-29 (after 270 index sessions)'
red_flags:
- 'Written after H-0065; an index-level test of the same family, not a variant of its settings.'
- 'A NIFTYBEES day moves about 50-70 bps; the signal must call it right well over half the time.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
