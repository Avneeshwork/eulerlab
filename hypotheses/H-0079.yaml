id: H-0079
title: 'Intraday pairs within an industry: open at a 2-sigma spread on 5-minute closes, close at zero or 15:10'
status: rejected
family: intraday_pairs
source_kind: paper
parent: ''
claim: 'Trading the 20 closest distance pairs within industries, re-formed every 20 sessions on the previous 40, opening at a 2-sigma intraday spread on 5-minute closes from 09:25 to 14:30 and closing when the spread crosses zero or at 15:10, earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Bowen, Hutchinson and O''Sullivan (2010): high-frequency distance pairs on the FTSE 100 earn gross profits, most in the first and last hours, sensitive to costs and delay. Research 161.'
source:
  research: '161'
  written_by: Claude, for the operator's request for six more minute-level intraday tests
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  rule: 'formation every 20 sessions on 40 sessions of 15:10 closes; 20 smallest sums of squared normalised-price differences within industries; sigma = std of the pair''s 09:20-15:10 spread change in formation; open on the first 5-minute close 09:25-14:30 with |spread since 09:20| >= 2 sigma, fill next minute; close when the spread crosses zero (next minute) or 15:10; Rs 1 lakh a leg'
  costs: 'cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x'
  window: '2021-08-20 to 2024-11-29'
red_flags:
- 'Two legs: about 24 bps of costs a pair trade.'
- 'Bowen et al. hold across days; this rule is intraday only.'
- 'Their source finds costs halve profits at 15 bps one way.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-06: 4,126 legs, 5.87 bps gross and -6.40 net a leg; net Sharpe -0.88 before 2024, -4.04 in 2024 (research 161). Fails.'
