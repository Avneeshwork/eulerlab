id: H-0065
title: 'Overnight winners lose in the daytime: short the top decile of past overnight returns, buy the bottom, 09:20 to 15:10'
status: draft
family: intraday_cash
source_kind: paper
parent: ''
claim: 'Ranking stocks each morning on their mean overnight return (prior close to the 09:19 close) over the previous 20 sessions, shorting the top decile and buying the bottom decile from 09:20 to 15:10 earns more than costs in both halves of 2021-09 to 2024-11.'
rationale: 'Lou, Polk and Skouras (2019, JFE 134(1)): an offsetting cross-period reversal; stocks with strong past overnight returns earn less in the daytime. H-0056 (intraday persistence) found 5.2 bps gross for the same-period effect. Research 158.'
source:
  research: '158'
  written_by: Claude, for the operator's request for five more minute-level cash strategies
  day: '2026-11-05'
configurations:
- shape: intraday_cash
  strategy: 'nse_overnight_winners_daytime_reversal'
  universe: 'F&O stocks with Kite minute bars (the india-five cache)'
  signal: 'mean of the previous 20 sessions'' prior-close-to-09:19 moves'
  short: 'top decile; long: bottom decile'
  entry: '09:20 open; exit: 15:10'
  costs: 'cash intraday plus 2 bps a side; ₹1 lakh a trade, 1x'
  window: '2021-08-20 to 2024-11-29'
red_flags:
