parent: ''
claim: 'Promoter buying: buy the session after a SAST promoter acquisition disclosure and hold 20 sessions:
  earns more than costs in both halves of the window and at twice the costs.'
rationale: 'Lakonishok and Lee (2001, RFS): insider purchases predict returns over months. H-0095 held
  one day (research 164).'
source:
  research: '172'
  written_by: 'Claude, for the operator''s request: half intraday, half swing, other data as signals for
    stocks and the index'
  day: '2026-11-07'
configurations:
- shape: swing_cash
  rule: promoter acquisition events as H-0095 (nse_reports_screen.promoter_events); buy at 09:20 on the
    first session after the disclosure, sell at 15:10 twenty sessions later; F&O stocks; at most ten open,
    earliest first
  data: SAST reports backfilled from 2021-07; minute snapshots
  costs: delivery (CNC) charges from costs.schedule plus 2 bps a side, 26.2 bps a round trip; Rs 1 lakh
    a position at 1x, at most ten open on Rs 10 lakh; long only (no overnight cash shorts)
  window: 2021-11-01 to 2024-10-15 (research 168's window; index minutes start 2021-11-01)
red_flags:
- 'Long only in a market that rose about 50% over the window: the report also gives the return over NIFTYBEES
  held the same days.'
- Same events as H-0095, which failed at one day.
- Fifty-three rules were tried before these; the simple gate does not correct for that search.
- Papers cited from memory and earlier notes, not re-fetched (research 172).
- 'Screen as research 170: gated only if net positive in both halves and at twice the costs.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
