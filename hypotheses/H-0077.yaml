claim: 'At 11:15, ranking stocks by their industry''s mean 09:20-11:15 return (without the stock) minus their own, buying the top decile and shorting the bottom decile from 11:16 to 15:10 earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Hou (2007, RFS): the lead-lag between stocks is mostly within industries, from slow diffusion of industry news. Research 161.'
