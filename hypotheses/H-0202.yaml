id: H-0202
title: Fade a 3% gap in either direction on a quiet-volume name
status: draft
family: autopilot_event_rules
source_kind: paper
parent: ''
claim: A stock gapping 3% or more (either way) after a session with traded value below 0.7x its 20-day
  mean reverses from open to close by more than 12 bps.
rationale: 'Branch-Ma overnight return paper: overnight moves partly reverse intraday. A gap in a name
  with no recent volume interest has no institutional flow to carry it, unlike H-0165 or H-0144 follow-through
  rules that failed. Value_ratio replaces delivery as the filter used in H-0175.'
source:
  research: autopilot
  paper: branch-ma-2006-overnight-return-anomaly
  written_by: the research autopilot (claude-sonnet), ADR-150
  day: '2026-11-08'
configurations:
- shape: engine_rule
  rule: 'intraday: when |gap| >= 0.03 and value_ratio[lag 1] <= 0.7; against gap; open to close; rank
    by |gap| desc'
  universe: the 500 most traded NSE stocks by 20-session traded value each day; stocks in series BE/BZ
    the previous session skipped (research 173, 174)
  costs: cash intraday charges plus 2 bps a side, Rs 1 lakh a position, at most ten a day, official open
    to close
  window: 2016-01-01 to 2024-11-30
engine:
  kind: intraday
  side: against
  direction_of:
    signal: gap
  when:
  - signal: gap
    absolute: true
    op: '>='
    value: 0.03
  - signal: value_ratio
    lag: 1
    op: <=
    value: 0.7
  rank_by:
    signal: gap
    absolute: true
red_flags:
- Gap-down longs historically lose on this engine (long leg of H-0131/H-0163 about -1 bps)
- Quiet-volume gaps may be unflagged news (filings not held as a signal)
- Few events per day, high variance
- Largely the same effect as H-0175 on the short side
- 'Daily bars: the official open and close stand in for real fills.'
- Written by the autopilot after 196 cards were tried; the simple gate does not correct for that search.
- 'Screen as research 176: gated only if net positive in both halves, at twice the costs, and clean on
  the engine''s bias checks.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Autopilot screen 2026-11-08: 8614 trades 2016-01-01 to 2024-11-30; net 141.47 bps each; net Sharpe
  7.149, halves 7.247 / 7.349, 6.611 at 2x costs. Gate: PROMOTE. Open-print check 2026-11-09 (research
  184): without ETFs 128.7 bps net; on 1,154 F&O-name trades 85.0 bps gross from the official open but
  19.2 from 09:20 (longs 8.2, shorts 27.0). Its edge is the opening auction, and it is the same bet as
  H-0194. Not traded with money (ADR-162).'
