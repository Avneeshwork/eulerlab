id: H-0212
title: Short a 2% gap-up on a 3x value spike with low delivery
status: draft
family: autopilot_event_rules
source_kind: agent
parent: ''
claim: Stocks gapping up 2% or more after a session with traded value at least 3x its 20-day mean and
  delivery no higher than normal fall from open to close net of costs.
rationale: A volume spike without delivery points to intraday traders and not investors. Their gap-up
  chase should fade. H-0175 used low delivery only, and H-0202 used low value. This tests the combination
  of high value and low delivery, which is a different type of crowd.
source:
  research: autopilot
  paper: ''
  written_by: the research autopilot (claude-sonnet), ADR-150
  day: '2026-11-09'
configurations:
- shape: engine_rule
  rule: 'intraday: when gap >= 0.02 and value_ratio[lag 1] >= 3 and delivery_ratio[lag 1] <= 1; short;
    open to close; rank by value_ratio[lag 1] desc'
  universe: the 500 most traded NSE stocks by 20-session traded value each day; stocks in series BE/BZ
    the previous session skipped (research 173, 174)
  costs: cash intraday charges plus 2 bps a side, Rs 1 lakh a position, at most ten a day, official open
    to close
  window: 2016-01-01 to 2024-11-30
engine:
  kind: intraday
  side: short
  when:
  - signal: gap
    op: '>='
    value: 0.02
  - signal: value_ratio
    lag: 1
    op: '>='
    value: 3.0
  - signal: delivery_ratio
    lag: 1
    op: <=
    value: 1.0
  rank_by:
    signal: value_ratio
    lag: 1
red_flags:
- Probably overlaps heavily with H-0175 trades, so not independent evidence
- Value spikes often come with news, and a gap-up on news can run
- Shorting stocks near upper circuit or on the ASM/GSM list may be infeasible
- The earlier Sharpe above 3 on similar rules needs lookahead checks
- 'Daily bars: the official open and close stand in for real fills.'
- Written by the autopilot after 208 cards were tried; the simple gate does not correct for that search.
- 'Screen as research 176: gated only if net positive in both halves, at twice the costs, and clean on
  the engine''s bias checks.'
holdout:
  starts: '2024-12-01'
  status: unread
result: ''
