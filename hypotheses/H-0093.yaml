id: H-0093
title: 'Buy a stock the session after one-sided bulk-deal buying, 09:20 to 15:10'
status: draft
family: intraday_nse_reports
source_kind: paper
parent: ''
claim: 'Buying F&O stocks the session after their one-sided bulk-deal buys exceeded one-sided sells (clients on both sides ignored), 09:20 to 15:10, at most ten a day, earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Chaturvedula et al. (2015, EMR): bulk buy trades carry positive abnormal returns. Research 164.'
source:
  research: '164'
  written_by: Claude, for the operator's request for more strategies on backfilled NSE reports
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  rule: 'net = one-sided buy value - one-sided sell value on t (a client both buying and selling a stock that day is dropped); net > 0 -> buy t+1 09:20-15:10; largest net first; at most ten'
  data: 'data/landing/nse_reports (bulk_deals, sast, fo_ban, slbm), backfilled from 2021-07-01'
  costs: 'cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x'
  window: '2021-08-20 to 2024-11-29'
red_flags:
- 'Most of the move is before the deal (front-running).'
- 'HFT firms dominate bulk-deal lists.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
