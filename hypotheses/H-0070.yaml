id: H-0070
title: 'After a month of frequent overnight-up, daytime-down Nifty days, buy NIFTYBEES for the day'
status: rejected
family: intraday_cash
source_kind: paper
parent: ''
claim: 'When the count of the previous 20 sessions with a positive Nifty overnight move and a negative Nifty daytime move is in the top fifth of the previous 250 sessions'' counts, buying NIFTYBEES from 09:20 to 15:10 earns more than costs in both halves of 2022-11 to 2024-11.'
rationale: 'Akbas et al. (2022): the market earns higher returns after months with abnormally frequent market-wide reversals, though the effect is economically small. Research 159.'
source:
  research: '159'
  written_by: Claude, for the operator's request for five more strategies
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  strategy: 'nifty_tug_of_war_niftybees'
  signal: 'count of the previous 20 Nifty sessions with overnight (prior close to 09:15 open) > 0 and daytime (09:15 open to the last close) < 0; its rank among the previous 250 counts; >= 80th -> long'
  entry: '09:20 open; exit: 15:10'
  costs: 'cash intraday as for a share plus 2 bps a side; NIFTYBEES ₹10 lakh, 1x'
  window: '2022-11 to 2024-11-29'
red_flags:
- 'The source calls the market-level effect economically very small.'
- 'Counts take few values; the top fifth includes ties at the boundary.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-06: 100 trades (2023-2024), 12.08 bps gross and +4.08 net a trade, net Sharpe 0.49; 2023 Sharpe 0.07, 2024 Sharpe 1.07 (research 159). Passes the screen''s both-halves rule; t about 0.8, far below the gate''s 3. Not gated (T-4469).'
retest: 'H-0071, 2026-11-06: the same rule on daily bars 2016-2024 lost 7.80 bps gross a trade, negative in eight of nine years. Dead.'
