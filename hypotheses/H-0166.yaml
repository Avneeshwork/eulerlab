claim: 'Buy at the open the day after one-sided bulk-deal buying, sell at the close: earns more than costs
  in both halves of 2021-07-01 to 2024-11-29 and at twice the costs.'
rationale: 'Chaturvedula et al. (2015): bulk buys carry information. H-0093 tested F&O stocks with minute
  fills (dead); bulk deals are mostly in smaller stocks.'
source:
  research: '176'
  written_by: Claude, for the operator's request to keep researching (half intraday, half swing, other
    data, 1x)
  day: '2026-11-07'
configurations:
- shape: daily_cash
  rule: net one-sided bulk-deal buying on t (nse_reports_screen.bulk_net); buy t+1 at the open, sell at
    the close; largest value first
  universe: the 500 most traded NSE stocks by 20-session traded value each day (price panel, research
    173); stocks in series BE/BZ the previous session skipped (research 174)
  costs: cash intraday charges plus 2 bps a side; Rs 1 lakh a position, 1x, at most ten a day; official
    open to official close
  window: 2021-07-01 to 2024-11-29
  data: price_panel.jsonl, delivery.jsonl, nse_reports (bulk_deals), nse_earnings_announcements
red_flags:
