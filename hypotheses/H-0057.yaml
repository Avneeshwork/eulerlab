id: H-0057
title: 'Buy a stock whose first hour traded three times its normal volume without moving much, hold to the close'
status: draft
family: intraday_cash
source_kind: paper
parent: ''
claim: 'At 10:15, among stocks whose 09:15-10:14 volume is at least three times its 14-session mean for that hour and whose move from the prior close to 10:14 is under 0.5% either way, buying the ten with the highest volume ratio at the 10:16 open and selling at 15:10 earns more than costs in both halves of 2021-09 to 2024-11.'
rationale: 'Gervais, Kaniel and Mingelgrin (2001, J. Finance 56(3)): a volume shock raises a stock''s visibility and later demand, and the premium is stronger when the volume comes without an extreme return. Research 157.'
source:
  research: '157'
  written_by: Claude, for the operator's request for five more minute-level cash strategies
  day: '2026-11-05'
configurations:
- shape: intraday_cash
  strategy: nse_quiet_volume_shock
  universe: F&O stocks with Kite minute bars, prior close >= ₹100, 14 prior sessions
  signal: first-hour volume / its 14-session mean >= 3 and |prior close to 10:14 close| < 0.5%
  chosen: the ten highest ratios a day
  entry: '10:16 open, long; exit: 15:10'
  sizing: ₹1 lakh a trade, 1x
  costs: cash intraday plus 2 bps a side
  window: 2021-09 to 2024-11-29
red_flags:
- 'The paper''s premium plays out over a month; the same-day part may be small.'
- 'A heavy, quiet first hour can be a block trade or an index rebalance with no follow-through.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
