  rule: as H-0103, on FINNIFTY options, strike multiple of 50, index Nifty Financial Services
  data: F&O bhavcopy OPEN/CLOSE of FINNIFTY options; Nifty Financial Services daily open/close from index_history
  costs: costs.schedule options rates on the day; 1 index point a leg a side slippage; a short leg pays
