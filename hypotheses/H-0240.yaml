id: H-0240
title: Buy gap-downs in 6-month uptrends when prior-day delivery was heavy
status: draft
family: autopilot_event_rules
source_kind: paper
parent: ''
claim: Long at the open of stocks gapping down 2% or more, with 120-day return of 20% or more and prior-day
  delivery ratio of 1.2 or more, open to close, nets positive after costs.
rationale: Extends H-0209 (gap-down with high delivery, long, net 111 bps) by requiring a long-term uptrend,
  in the spirit of github-2021-connors-rsi2-bot (sharp drop inside an uptrend bounces). Heavy delivery
  the day before suggests holders are not selling.
source:
  research: autopilot
  paper: github-2021-connors-rsi2-bot
  written_by: the research autopilot (claude-sonnet), ADR-150
  day: '2026-11-12'
configurations:
- shape: engine_rule
  rule: 'intraday: when gap <= -0.02 and ret(120)[lag 1] >= 0.2 and delivery_ratio[lag 1] >= 1.2; long;
    open to close; rank by gap asc'
  universe: the 500 most traded NSE stocks by 20-session traded value each day; stocks in series BE/BZ
    the previous session skipped (research 173, 174)
  costs: cash intraday charges plus 2 bps a side, Rs 1 lakh a position, at most ten a day, official open
    to close
  window: 2016-01-01 to 2024-11-30
engine:
  kind: intraday
  side: long
  when:
  - signal: gap
    op: <=
    value: -0.02
  - signal: ret
    lag: 1
    n: 120
    op: '>='
    value: 0.2
  - signal: delivery_ratio
    lag: 1
    op: '>='
    value: 1.2
  rank_by:
    signal: gap
    order: asc
red_flags:
- Near-duplicate of H-0209 with an extra filter, so it may add nothing
- Gap-downs on bad news (results, regulatory) do not bounce
- Fewer trades than H-0209 may make the result noisy
- 'Daily bars: the official open and close stand in for real fills.'
- Written by the autopilot after 238 cards were tried; the simple gate does not correct for that search.
- 'Screen as research 176: gated only if net positive in both halves, at twice the costs, and clean on
  the engine''s bias checks.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Autopilot screen 2026-11-12: 1803 trades 2016-01-01 to 2024-11-30; net 103.24 bps each; net Sharpe
  1.89, halves 1.742 / 2.22, 1.681 at 2x costs. Flagged: not a few lucky days. Not gated (bias check).'
