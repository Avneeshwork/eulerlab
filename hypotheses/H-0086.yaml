id: H-0086
title: 'On monthly stock-option expiry, trade a stock toward its largest open-interest strike from 13:01 to 15:10'
status: draft
family: intraday_expiry
source_kind: paper
parent: ''
claim: 'On monthly stock-option expiry days, trading stocks that are 1% to 3% from the expiring strike with the most call-plus-put open interest at the prior close toward that strike from 13:01 to 15:10, at most ten, closest first, earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Ni, Pearson and Poteshman (2005, JFE): optionable stocks close near strikes on expiry days. Research 162.'
source:
  research: '162'
  written_by: Claude, for the operator's request to research the next five intraday rules
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  rule: 'NSE F&O bhavcopy: expiring stock options, strike with max CE+PE open interest at the prior session; 13:00 close 1%-3% away; trade toward the strike, fill 13:01, exit 15:10; at most ten, closest first'
  costs: 'cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x'
  window: '2021-08-20 to 2024-11-29'
red_flags:
- 'About 40 expiries.'
- 'Indian stock options settle on the closing price, after 15:10.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
