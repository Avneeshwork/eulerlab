claim: 'Buying stocks whose close-to-close return was +2% or more with total futures open interest up 10% or more the day before, and shorting those with -2% or less and open interest up 10% or more, from 09:20 to 15:10, at most ten a day, earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Indian trader practice (long and short build-up); no academic test was found. Research 162.'
