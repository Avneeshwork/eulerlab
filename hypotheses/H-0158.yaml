claim: 'Fear spike at the open: when India VIX is 5% above its previous close at 09:30, buy the five highest-beta
  liquid stocks to 15:10: earns more than costs in both halves of the window and at twice the costs.'
rationale: 'Whaley (2000) and Nagel (2012): liquidity providers earn most when fear spikes; reversal after
  volatility shocks.'
