claim: 'Relative strength against a falling Nifty: at 11:00 buy stocks up 1% while the Nifty is down 0.5%
  (and the mirror), to 15:10: earns more than costs at Rs 5 lakh a trade in both halves of 2021-11 to
  2024-10.'
rationale: Practitioner relative strength; stocks that resist a market fall carry their own buyers.
