configurations:
- shape: intraday_cash
  rule: 'among the 100 most traded: yesterday''s last close within 5% of the top of its 5-minute-close
    range and traded value >= 2x its 20-session mean, |yesterday''s return| >= 2%; buy at 09:20 to 15:10;
    the mirror (bottom 5%) sells; at most ten, largest value ratio first'
