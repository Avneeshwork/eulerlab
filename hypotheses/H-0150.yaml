status: rejected
family: intraday_stock_1x
source_kind: practitioner
parent: ''
claim: 'Buy a stock that closed in the top 5% of its range on twice its normal turnover, next day 09:20
  to 15:10 (mirror for weak closes): earns more than costs at Rs 1 lakh a position (1x) in both halves
  of 2021-11 to 2024-10 and at twice the costs.'
rationale: Practitioner closing-strength continuation; buying pressure into the close.
