id: H-0161
title: 'Daily bars, every liquid NSE stock: short at the open the day after a 3% rise on half the usual
  delivery, cover at the close'
status: draft
family: stock_other_data_daily
source_kind: paper
parent: H-0160
claim: 'Daily bars, every liquid NSE stock: short at the open the day after a 3% rise on half the usual
  delivery, cover at the close: earns more than costs in both halves of 2016-01-01 to 2024-11-29 and at
  twice the costs.'
rationale: H-0160's rule (research 172) on every NSE stock in the 500 most traded by 20-session traded
  value that day, 2016-2024, so the universe is what was liquid then, not today's F&O list.
source:
  research: '173'
  written_by: 'Claude, to test research 172''s two PROMOTEs without today''s F&O list (HISTORY #82, T-4500)'
  day: '2026-11-07'
configurations:
- shape: daily_cash
  rule: price panel (every NSE EQ stock, 2015 on) and NSE delivery (2015 on); yesterday's close-to-close
    return >= 3% and delivery % <= half its previous 20-session mean; short at today's official open,
    cover at today's official close; at most ten a day, lowest delivery ratio first; Rs 1 lakh, 1x; cash
    intraday charges plus 2 bps a side
  data: data/derived/price_panel.jsonl, delivery.jsonl, nse_reports sast
  window: 2016-01-01 to 2024-11-29
red_flags:
- Written after H-0160 and H-0153 passed and after the survivorship check cut them; the rules are theirs,
  the universe is new.
- 'Daily bars: the official open and close stand in for 09:20 and 15:10 fills; the close is a 30-minute
  average price an MIS order cannot reach (as H-0098).'
- 'Raw prices: a holding window with a day-to-day close ratio outside 0.6-1.6 is dropped as a likely split
  or bonus (A-119).'
- 'Screen as research 170: gated only if net positive in both halves and at twice the costs.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 9,867 trades 2016-01 to 2024-11 on the 500 most traded NSE stocks each day,
  46.37 bps gross and +34.11 net a trade; net Sharpe 2.29, halves 2.55 / 2.03, 1.47 at 2x costs; every
  year 2016-2024 positive (research 173). Gate 2026-11-07 (validate #118, gate #119): PROMOTE, 9 of 9
  (PSR 1.000, 9 of 9 years positive). Strict-mode figures: deflated Sharpe 0.999, dropping the best five
  names keeps 95%, 2x costs keeps 64%, worst half 88%; fails only Romano-Wolf over Nifty (0.92 vs critical
  1.07). Not checked: whether each stock could be shorted intraday on the day (ASM/T2T lists, A-120).
  Open-print check 2026-11-08 (research 180): 29.0 bps gross from the official open, 28.8 from 09:20 to
  15:10 on F&O stocks: does not depend on the auction prints.'
