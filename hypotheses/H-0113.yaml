id: H-0113
title: When an industry's largest stock moves 1% in 15 minutes, trade its slowest peer the same way, hold
  30 minutes
status: rejected
family: intraday_stock_mft
source_kind: paper
parent: ''
claim: 'When an industry''s largest stock moves 1% in 15 minutes, trade its slowest peer the same way,
  hold 30 minutes: earns more than costs at Rs 5 lakh a trade in both halves of 2021-11 to 2024-10.'
rationale: 'Hou (2007, RFS): within-industry lead-lag from large to small firms. H-0077 tested a once-a-day
  industry catch-up (research 161).'
source:
  research: '168'
  written_by: Claude, for the operator's request for ten MFT-style stock scalps on minute data, 5-10 trades
    a day, Zerodha MIS leverage
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  kind: industry lead-lag
  rule: 'at each 15-minute close 09:45-14:30, for industries with >= 4 of the 200 most traded stocks (today''s
    NSE industry, A-112): if the industry''s largest by 20-session traded value moved >= 1.0% over the
    last 15 minutes, trade the peer whose move in that direction is smallest, from the next fill, exit
    30 minutes later; one signal per industry per hour'
  data: research 161's minute snapshots of the 416 F&O stocks (5-minute closes and next-minute fills,
    09:20 to 15:10); Nifty 50 index minutes; Nifty 50 daily closes for beta
  timeframe: 5-minute closes
  costs: cash intraday charges plus 2 bps a side; Rs 5 lakh a trade (Rs 1 lakh margin at Zerodha's 5x
    MIS), at most 10 open at once on Rs 10 lakh of margin; returns on the Rs 10 lakh
  window: 2021-11-01 to 2024-10-15 (Nifty minutes start 2021-11-01; the last index file before the 2024-11-30
    cut ends 2024-10-15)
red_flags:
- Close to H-0077 (industry laggards at 11:15), which failed.
- Ten rules written together; under the simple gate (no search correction) about one in twenty pure-noise
  rules would pass at 5%, so a single pass among ten is weak evidence.
- Decisions and stops on 5-minute closes only (the snapshots keep no highs, lows or volume per bar); a
  real stop would trigger inside the bar.
- 2 bps a side of slippage is assumed for every stock in the liquid set, not measured (T-906, A-052).
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 3255 trades (4.47 a day), 7.5 bps gross and -0.96 net a trade at Rs 5 lakh
  (cost 8.47), net Sharpe -0.202, halves -1.798 / 0.316, drawdown -48% of margin; by year on margin 2021
  +11%, 2022 -30%, 2023 -18%, 2024 +23% (research 168). Fails the screen; not gated.'
