id: H-0106
title: Buy a stock on the first session after it leaves the F&O ban, 09:20 to 15:10
status: draft
family: intraday_nse_reports
source_kind: practitioner
parent: ''
claim: Buying F&O stocks on the first trade date they are out of the F&O ban list after being in it, 09:20
  to 15:10, at most ten a day, earns more than costs in both halves of 2021-08 to 2024-11.
rationale: During a ban only position-reducing trades are allowed; when it lifts, the new longs held back
  can enter. The mirror of H-0096, which passed. No academic test was found.
