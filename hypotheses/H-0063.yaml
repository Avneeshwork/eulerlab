id: H-0063
title: 'Trade NIFTYBEES against an extreme Nifty put-call ratio, 09:20 to 15:10'
status: draft
family: intraday_cash
source_kind: paper
parent: ''
claim: 'When the Nifty put-call open-interest ratio of the nearest expiry at the prior close is in the top fifth of its previous 250 sessions, buying NIFTYBEES from 09:20 to 15:10, and when in the bottom fifth selling it, earns more than costs in both halves of 2021-11 to 2024-11.'
rationale: 'A high put-call ratio is read as bearish crowding and a contrarian buy; a 2019 Economies study of the Nifty frames the ratio as negatively related to next-day returns (Pan and Poteshman 2006 for the mechanism). US index evidence is mostly negative. Research 158.'
source:
  research: '158'
  written_by: Claude, for the operator's request for five more minute-level cash strategies
  day: '2026-11-05'
configurations:
- shape: intraday_cash
  strategy: 'nifty_pcr_contrarian_niftybees'
  signal: 'total put OI / total call OI of the nearest Nifty expiry at the prior close; its percentile among the previous 250 sessions; >= 80th -> long, <= 20th -> short'
  entry: '09:20 open; exit: 15:10'
  costs: 'cash intraday as for a share plus 2 bps a side; NIFTYBEES ₹10 lakh, 1x'
  window: '2021-11-01 to 2024-11-29'
red_flags:
- 'The nearest expiry rolls each week, so the ratio jumps on expiry days.'
- 'Practitioner bands (0.95-1.05) are not used; the percentile rule is fixed here.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
