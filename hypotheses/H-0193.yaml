id: H-0193
title: When India VIX rose 15% yesterday, buy the ten liquid stocks that fell most and hold ten sessions
status: draft
family: stock_swing_daily_all_nse
source_kind: paper
parent: ''
claim: 'When India VIX rose 15% yesterday, buy the ten liquid stocks that fell most and hold ten sessions:
  earns more than costs in both halves of 2016-01-01 to 2024-11-29 and at twice the costs.'
rationale: As H-0186, at a ten-session horizon.
source:
  research: '178'
  written_by: Claude, for the operator's request to keep building strategies in parallel with the autopilot
  day: '2026-11-08'
configurations:
- shape: daily_cash
  rule: as H-0186's selection, held ten sessions
  universe: the 500 most traded NSE stocks by 20-session traded value each day; stocks in series BE/BZ
    the previous session skipped (research 173, 174)
  costs: delivery charges plus 2 bps a side; Rs 1 lakh a position, 1x, long only, at most ten open; in
    at the official open, out at the official close of the exit session
  window: 2016-01-01 to 2024-11-29
  data: price_panel.jsonl (with highs and lows), delivery.jsonl, index_history.jsonl (India VIX), nse_reports
    bulk_deals, nse_earnings_announcements
red_flags:
- 'Uses signals the rule engine (ADR-150) does not have: price-limit closes, India VIX, bulk-deal client
  names, multi-day delivery.'
- 'Daily bars: the official open and close stand in for 09:20 and 15:10 fills.'
- About 185 rules were tried before these; the simple gate does not correct for that search.
- 'Screen as research 170: gated only if net positive in both halves and at twice the costs; a pass is
  checked for being the same bet as H-0161, H-0168 or H-0162 (correlation >= 0.5, A-122).'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
