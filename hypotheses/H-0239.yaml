id: H-0239
title: Fade gap-ups in stocks already up 15%+ in 20 days on quiet volume
status: draft
family: autopilot_event_rules
source_kind: agent
parent: ''
claim: Short at the open of stocks gapping up 2% or more after a 20-day run of 15% or more with prior-day
  traded value at or below its 20-day mean, open to close, nets positive after 12 bps costs.
rationale: Builds on H-0175 and H-0202, where low-participation gaps reversed. A gap after an extended
  run, with no volume behind it, is likely retail chasing that fades intraday. It adds the stretch condition
  (ret 20) to the existing gap-fade ideas.
source:
  research: autopilot
  paper: ''
  written_by: the research autopilot (claude-sonnet), ADR-150
  day: '2026-11-12'
configurations:
- shape: engine_rule
  rule: 'intraday: when gap >= 0.02 and ret(20)[lag 1] >= 0.15 and value_ratio[lag 1] <= 1; short; open
    to close; rank by gap desc'
  universe: the 500 most traded NSE stocks by 20-session traded value each day; stocks in series BE/BZ
    the previous session skipped (research 173, 174)
  costs: cash intraday charges plus 2 bps a side, Rs 1 lakh a position, at most ten a day, official open
    to close
  window: 2016-01-01 to 2024-11-30
engine:
  kind: intraday
  side: short
  when:
  - signal: gap
    op: '>='
    value: 0.02
  - signal: ret
    lag: 1
    n: 20
    op: '>='
    value: 0.15
  - signal: value_ratio
    lag: 1
    op: <=
    value: 1.0
  rank_by:
    signal: gap
red_flags:
- Overlaps heavily with H-0175 and H-0202, so it may be the same bet already held
- Large gap-ups cluster in small illiquid names where shorting fills are optimistic
- The 20-day run condition may just select high-volatility names
- 'Daily bars: the official open and close stand in for real fills.'
- Written by the autopilot after 238 cards were tried; the simple gate does not correct for that search.
- 'Screen as research 176: gated only if net positive in both halves, at twice the costs, and clean on
  the engine''s bias checks.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Autopilot screen 2026-11-12: 4086 trades 2016-01-01 to 2024-11-30; net 103.22 bps each; net Sharpe
  4.592, halves 4.752 / 4.479, 4.114 at 2x costs. Clean survivor; waiting for the week''s gate allowance.'
