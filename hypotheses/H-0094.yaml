id: H-0094
title: 'Short a stock the session after one-sided bulk-deal selling, 09:20 to 15:10'
status: rejected
family: intraday_nse_reports
source_kind: paper
parent: ''
claim: 'Shorting F&O stocks the session after their one-sided bulk-deal sells exceeded one-sided buys, 09:20 to 15:10, at most ten a day, earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Chaturvedula et al. (2015, EMR): sell trades show weaker effects than buys. Research 164.'
source:
  research: '164'
  written_by: Claude, for the operator's request for more strategies on backfilled NSE reports
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  rule: 'net < 0 -> short t+1 09:20-15:10; largest absolute net first; at most ten'
  data: 'data/landing/nse_reports (bulk_deals, sast, fo_ban, slbm), backfilled from 2021-07-01'
  costs: 'cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x'
  window: '2021-08-20 to 2024-11-29'
red_flags:
- 'Sell-side effects are weaker in the source.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-06: 298 trades, 14.75 bps gross and +2.49 net a trade; net Sharpe -0.00 before 2024, 0.32 in 2024 (research 164). Fails the both-halves rule.'
