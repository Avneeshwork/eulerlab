id: H-0082
title: 'Fade a 1.5% stretch from VWAP between 10:00 and 14:30, exit at VWAP or 15:10'
status: rejected
family: intraday_mean_reversion
source_kind: paper
parent: ''
claim: 'Trading a stock back toward its session VWAP the first time its close is 1.5% or more away between 10:00 and 14:30, exiting when a close crosses VWAP or at 15:10, at most ten a day, earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'A common practitioner intraday rule; no academic test was found. Research 161.'
source:
  research: '161'
  written_by: Claude, for the operator's request for six more minute-level intraday tests
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  rule: 'session VWAP of typical price (h+l+c)/3 weighted by volume from 09:16; first minute 10:00-14:30 with |close/VWAP - 1| >= 1.5%; trade toward VWAP at the next minute; exit next minute after a close crosses VWAP, else 15:10; at most ten a day, earliest first'
  costs: 'cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x'
  window: '2021-08-20 to 2024-11-29'
red_flags:
- 'No academic support.'
- 'A stock 1.5% from VWAP is often on news and keeps going.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-06: 8,070 trades, 1.31 bps gross and -10.95 net a trade; net Sharpe -2.15 before 2024, -1.42 in 2024 (research 161). Fails.'
