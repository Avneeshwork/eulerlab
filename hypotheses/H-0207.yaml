id: H-0207
title: Buy after a 250-session low is hit with a volume climax and delivery surge, hold 20 sessions
status: draft
family: autopilot_event_rules
source_kind: agent
parent: ''
claim: Stocks closing at a 250-session low on traded value of 3x normal and delivery 1.5x normal rebound
  more than 80 bps net over 20 sessions.
rationale: Capitulation selling with unusually high delivery means long-only holders (not intraday traders)
  absorbed the supply. H-0181 required a bulk buy and was too rare; this uses market-wide data with a
  larger sample. Unlike H-0180, it requires a volume climax at a fresh low.
source:
  research: autopilot
  paper: ''
  written_by: the research autopilot (claude-sonnet), ADR-150
  day: '2026-11-08'
configurations:
- shape: engine_rule
  rule: 'swing: when at_low(250)[lag 1] and value_ratio[lag 1] >= 3 and delivery_ratio[lag 1] >= 1.5;
    long; hold 20 sessions; rank by value_ratio[lag 1] desc'
  universe: the 500 most traded NSE stocks by 20-session traded value each day; stocks in series BE/BZ
    the previous session skipped (research 173, 174)
  costs: delivery charges plus 2 bps a side, Rs 1 lakh a position, at most ten open
  window: 2016-01-01 to 2024-11-30
engine:
  kind: swing
  hold: 20
  side: long
  when:
  - signal: at_low
    lag: 1
    n: 250
  - signal: value_ratio
    lag: 1
    op: '>='
    value: 3.0
  - signal: delivery_ratio
    lag: 1
    op: '>='
    value: 1.5
  rank_by:
    signal: value_ratio
    lag: 1
red_flags:
- H-0180, a related catch-the-knife rule, lost 154 bps a position
- Delivery spikes at lows may be margin-call or pledged-share liquidations
- Entries cluster in market crashes (e.g. March 2020), so the result may be one event
- Surveillance (ASM/GSM) names may be untradable
- 'Daily bars: the official open and close stand in for real fills.'
- Written by the autopilot after 196 cards were tried; the simple gate does not correct for that search.
- 'Screen as research 176: gated only if net positive in both halves, at twice the costs, and clean on
  the engine''s bias checks.'
holdout:
  starts: '2024-12-01'
  status: unread
result: ''
