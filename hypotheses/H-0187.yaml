claim: 'The day after a 5% results reaction, trade with it from open to close: earns more than costs in
  both halves of 2021-07-01 to 2024-11-29 and at twice the costs.'
rationale: 'Chan (2003): moves with news continue. The session after the results reaction, not the reaction
  itself (H-0168 fades the reaction morning).'
source:
