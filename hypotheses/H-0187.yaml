id: H-0187
title: The day after a 5% results reaction, trade with it from open to close
status: draft
family: stock_intraday_daily_all_nse
source_kind: paper
parent: ''
claim: 'The day after a 5% results reaction, trade with it from open to close: earns more than costs in
  both halves of 2021-07-01 to 2024-11-29 and at twice the costs.'
rationale: 'Chan (2003): moves with news continue. The session after the results reaction, not the reaction
  itself (H-0168 fades the reaction morning).'
source:
  research: '178'
  written_by: Claude, for the operator's request to keep building strategies in parallel with the autopilot
  day: '2026-11-08'
configurations:
- shape: daily_cash
  rule: results morning on day R (as H-0168); R's close-to-close return >= 5% buys on R+1, <= -5% shorts
    on R+1; open to close; largest move first
  universe: the 500 most traded NSE stocks by 20-session traded value each day; stocks in series BE/BZ
    the previous session skipped (research 173, 174)
  costs: cash intraday charges plus 2 bps a side; Rs 1 lakh a position, 1x, at most ten a day; official
    open to official close
  window: 2021-07-01 to 2024-11-29
  data: price_panel.jsonl (with highs and lows), delivery.jsonl, index_history.jsonl (India VIX), nse_reports
    bulk_deals, nse_earnings_announcements
red_flags:
- 'Uses signals the rule engine (ADR-150) does not have: price-limit closes, India VIX, bulk-deal client
  names, multi-day delivery.'
- 'Daily bars: the official open and close stand in for 09:20 and 15:10 fills.'
- About 185 rules were tried before these; the simple gate does not correct for that search.
- 'Screen as research 170: gated only if net positive in both halves and at twice the costs; a pass is
  checked for being the same bet as H-0161, H-0168 or H-0162 (correlation >= 0.5, A-122).'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-08: 935 trades, {''gross_mean'': 78.91, ''net_mean'': 66.63} bps; net Sharpe 2.578,
  halves 2.318 / 2.813, at 2x costs 2.135; by year 2021 +10%, 2022 +13%, 2023 +21%, 2024 +22% (research
  178). Gate 2026-11-08 (validate #132, gate #133): PROMOTE, 9 of 9. Strict-mode figures: deflated Sharpe
  0.965, fails only Romano-Wolf over Nifty (0.26 vs 1.82). Same-bet check: correlation with H-0161 -0.08,
  H-0168 0.01, H-0162 -0.11. Open-print check 2026-11-08 (research 180): 61.7 bps gross from the official
