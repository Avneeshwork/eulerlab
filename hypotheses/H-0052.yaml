result: 'Screen 2026-11-05: 47 trades, 16.54 bps gross and +8.54 net a trade, net Sharpe 0.52; positive before 2024 (0.86), negative in 2024 (-1.16) (research 156). Fails the both-halves rule. Re-gated 2026-11-06 under the simple mandate (ADR-140, ADR-141), on the operator''s request to re-check the good rejected strategies: PAPER. net Sharpe 0.52 (1.03 / -0.42), PSR 0.841, 2 of 4 years, 0.03 at 2x costs. Research 165.'
