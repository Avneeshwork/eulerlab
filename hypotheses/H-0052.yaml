claim: 'On each session followed by a weekday market holiday, buying NIFTYBEES at the 09:20 open and selling at 15:10 earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Ariel (1990, J. Finance): pre-holiday returns are several times normal. Indian evidence is split: a 2025 FIIB Business Review study finds a persistent pre-holiday anomaly in Indian indices; a 2002-2014 NSE/BSE study finds none. Research 156.'
