id: H-0124
title: After a 1.5% morning move, trade the break of a tight 10:15-11:15 range in the morning's direction,
  to 15:10
status: draft
family: intraday_stock_mft
source_kind: practitioner
parent: ''
claim: 'After a 1.5% morning move, trade the break of a tight 10:15-11:15 range in the morning''s direction,
  to 15:10: earns more than costs at Rs 5 lakh a trade in both halves of 2021-11 to 2024-10.'
rationale: Practitioner volatility-contraction breakout (flag / pennant).
source:
  research: '169'
  written_by: Claude, for the operator's request for ten more MIS-sized stock scalps after research 168
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  rule: 'among the 100 most traded stocks: morning move = 10:15 close / previous close - 1, |move| >=
    1.5%; range = highest and lowest close 10:15-11:15, (high - low) / low < 0.4%; from 11:20 to 14:00
    the first close beyond the range in the morning''s direction trades that way; stop at the fill after
    a close beyond the range''s other side; else 15:10; at most ten'
  data: research 161's minute snapshots of the 416 F&O stocks (5-minute closes and next-minute fills,
    09:20 to 15:10); Nifty 50 index minutes; Nifty 50 daily closes for beta
  timeframe: 5-minute closes
  costs: cash intraday charges plus 2 bps a side; Rs 5 lakh a trade (Rs 1 lakh margin at Zerodha's 5x
    MIS), at most 10 open at once on Rs 10 lakh of margin; returns on the Rs 10 lakh
  window: 2021-11-01 to 2024-10-15
red_flags:
- Close to H-0117 (midday range break, KILL); this one requires a prior move and a tight range.
- 'Written after research 168''s results were known: two rules there passed the paper bar, and ideas near
  them are flagged as such.'
- 'Ten more rules under the simple gate (no search correction): twenty scalps in all, so one or two passes
  are expected from noise alone.'
- Decisions and stops on 5-minute closes only; slippage of 2 bps a side assumed, not measured (T-4490).
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 1043 trades (1.43 a day), 11.81 bps gross and 3.34 net a trade at Rs 5 lakh
  (cost 8.47), net Sharpe 0.61, halves 0.415 / 0.907, drawdown -14% of margin; by year on margin 2021
  -1%, 2022 +18%, 2023 -2%, 2024 +2% (research 169). Gate 2026-11-07 (validate #106, gate #107): PAPER.
  Failed promotion on 2x costs (-0.95) and probabilistic Sharpe 0.863; paper bar passed. Dropping the
  best 5 names turns it negative.'
