id: H-0160
title: 'Speculative rally fade: short a liquid stock the day after a 3% rise on unusually low delivery,
  09:20 to 15:10'
status: draft
family: stock_intraday_other_data
source_kind: paper
parent: ''
claim: 'Speculative rally fade: short a liquid stock the day after a 3% rise on unusually low delivery,
  09:20 to 15:10: earns more than costs in both halves of the window and at twice the costs.'
rationale: Delivery percentage separates shares taken home from day-traded volume; a rise carried by day
  traders is speculative and reverses (Indian broker guidance; Barber and Odean 2008 on attention buying).
  The high-delivery follow (H-0024 lab, research 112) is the opposite case.
source:
  research: '172'
  written_by: 'Claude, for the operator''s request: half intraday, half swing, other data as signals for
    stocks and the index'
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  rule: yesterday's close-to-close return >= 3% and delivery % <= half its previous 20-session mean (delivery.jsonl,
    knowledge time 20:00); short at 09:20, cover at 15:10; the 100 most traded; at most ten, lowest delivery
    ratio first
  data: NSE delivery (2015 on); minute snapshots
  costs: cash intraday charges plus 2 bps a side; Rs 1 lakh a position at 1x, at most ten open on Rs 10
    lakh; 12.24 bps a round trip
  window: 2021-11-01 to 2024-10-15 (research 168's window; index minutes start 2021-11-01)
