id: H-0209
title: Long a 2% gap-down that follows a high-delivery session
status: draft
family: autopilot_event_rules
source_kind: paper
parent: ''
claim: Stocks gapping down 2% or more after a session with delivery at least 1.5x normal rise from open
  to close by more than the 12.24 bps round-trip cost.
rationale: High delivery the day before points to investors accumulating, not speculators. A gap down
  onto accumulation is more likely to be overreaction than information, in the spirit of tripathi-2015-prior-return-intraday-india.
  H-0175 only tested low-delivery gap-ups on the short side; this tests the opposite delivery condition
  on the long side.
source:
  research: autopilot
  paper: tripathi-2015-prior-return-intraday-india
  written_by: the research autopilot (claude-sonnet), ADR-150
  day: '2026-11-09'
configurations:
- shape: engine_rule
  rule: 'intraday: when gap <= -0.02 and delivery_ratio[lag 1] >= 1.5; long; open to close; rank by gap
    asc'
  universe: the 500 most traded NSE stocks by 20-session traded value each day; stocks in series BE/BZ
    the previous session skipped (research 173, 174)
  costs: cash intraday charges plus 2 bps a side, Rs 1 lakh a position, at most ten a day, official open
    to close
  window: 2016-01-01 to 2024-11-30
engine:
  kind: intraday
  side: long
  when:
  - signal: gap
    op: <=
    value: -0.02
  - signal: delivery_ratio
    lag: 1
    op: '>='
    value: 1.5
  rank_by:
    signal: gap
    order: asc
red_flags:
- Heavy delivery before a gap down may be informed selling that continues
- Gap-down stocks may be on the ASM/GSM list or circuit-limited, so fills are doubtful
- Long side of gap-reversal rules was weak in H-0131 and H-0140
- Few trades per day in quiet years
- 'Daily bars: the official open and close stand in for real fills.'
- Written by the autopilot after 208 cards were tried; the simple gate does not correct for that search.
- 'Screen as research 176: gated only if net positive in both halves, at twice the costs, and clean on
  the engine''s bias checks.'
holdout:
  starts: '2024-12-01'
  status: unread
result: ''
