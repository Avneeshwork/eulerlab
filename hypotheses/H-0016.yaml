id: H-0016
title: Prior-day floor pivot breakout earns positive NSE intraday returns after costs
status: rejected

claim: >
  On five fixed liquid NSE stocks, following 5-minute closes above prior-day
  R1 and below prior-day S1, reversing only at the opposite pivot threshold,
  produces positive intraday returns after modeled costs.

rationale: >
  A public GitHub strategy uses prior-session HLC to form floor pivots and
  holds the breakout direction between R1 and S1. Its example is not an NSE
  profitability result, so this fixed India adaptation is tested independently.

source: >
  HPotter via FMZ, Dynamic Pivot Point Backtest Strategy. See
  docs/RESEARCH/108-github-prior-day-pivot-nse-screen.md.

configurations:
  - {universe: [RELIANCE, HDFCBANK, ICICIBANK, TCS, INFY], timeframe: 5m, levels: prior-day floor pivots R1/S1, entry: close above R1/below S1 then next open, reversal: opposite threshold, square_off: 15:10, evaluation: [2024-01-01, 2024-11-30], capital_rupees: 1000000, per_stock_notional: 200000, slippage_bps_per_side: 2}

result: >
  Negative after modeled costs. Across 224 sessions and 816 round trips, gross
  return was +12.14% (Sharpe 1.867), while net return was -4.50%, net Sharpe
  -0.701 and net maximum drawdown -10.87%. Net profit factor was 0.928;
  estimated costs were ₹160,678. Two stocks were positive net and three were
  negative.

red_flags:
  - Public source code is educational and does not provide verified NSE returns.
  - Five fixed current stocks leave survivorship and universe-selection bias.
  - Reversal frequency makes the result sensitive to fees and slippage.
  - Slippage is assumed, not estimated from bid/ask or market-impact data.
  - One evaluation window is used; no later holdout was read.
