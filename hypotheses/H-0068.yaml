id: H-0068
title: 'Past-month winners keep winning in the daytime: long the top decile of 20-day returns, short the bottom, 09:20 to 15:10'
status: draft
family: intraday_cash
source_kind: paper
parent: ''
claim: 'Ranking stocks each morning on their compounded return over the previous 20 sessions, buying the top decile and shorting the bottom decile from 09:20 to 15:10 earns more than costs in both halves of 2021-09 to 2024-11.'
rationale: 'Lou, Polk and Skouras (2019): short-term reversal profits are earned overnight and the daytime component has the opposite sign, so past-month winners should beat losers in the daytime. Research 159.'
source:
  research: '159'
  written_by: Claude, for the operator's request for five more strategies
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  strategy: 'nse_month_winners_daytime'
  universe: 'F&O stocks in the india-five cache with 20 prior sessions'
  daily return: '(1 + prior close to 09:19 close) x (09:20 open to 15:10 open) - 1, from the india-five cache'
  signal: 'compounded daily return over the previous 20 sessions'
  long: 'top decile; short: bottom decile; at least 100 ranked'
  entry: '09:20 open; exit: 15:10'
  costs: 'cash intraday plus 2 bps a side; ₹1 lakh a position, 1x'
  window: '2021-09 to 2024-11-29'
red_flags:
- 'Close cousin of H-0056 (20-day daytime-return persistence, 5.2 bps gross, dead) and H-0065 (20-day overnight, 13.9 bps gross, failed); this ranks on the whole day.'
- 'Daily rebalancing of two deciles pays a round trip on every position every day.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
