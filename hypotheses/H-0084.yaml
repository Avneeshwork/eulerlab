id: H-0084
title: 'Lottery stocks lose in the daytime: short the top decile of last month''s largest daily return, buy the bottom, 09:20 to 15:10'
status: draft
family: intraday_cross_section
source_kind: paper
parent: ''
claim: 'Shorting the top decile of MAX (the largest daily return in the previous 20 sessions) and buying the bottom decile from 09:20 to 15:10 earns more than costs in both halves of 2021-08 to 2024-11.'
rationale: 'Bali, Cakici and Whitelaw (2011, JFE): high-MAX stocks underperform by over 1% a month. Research 162.'
source:
  research: '162'
  written_by: Claude, for the operator's request to research the next five intraday rules
  day: '2026-11-06'
configurations:
- shape: intraday_cash
  rule: 'MAX over the previous 20 sessions (at least 15; returns beyond 20% dropped); top decile short, bottom decile long; 09:20 to 15:10'
  costs: 'cash intraday plus 2 bps a side; Rs 1 lakh a position, 1x'
  window: '2021-08-20 to 2024-11-29'
red_flags:
- '1% a month is about 5 bps a day, below a 12 bps round trip.'
- 'No source splits MAX returns into day and night.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
