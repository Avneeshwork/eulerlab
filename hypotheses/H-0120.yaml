id: H-0120
title: Break of the previous session's high close after 10:00 on a Nifty-up day (low on a down day), to
  15:10
status: rejected
family: intraday_stock_mft
source_kind: practitioner
parent: ''
claim: 'Break of the previous session''s high close after 10:00 on a Nifty-up day (low on a down day),
  to 15:10: earns more than costs at Rs 5 lakh a trade in both halves of 2021-11 to 2024-10.'
rationale: Practitioner prior-day high/low breakout.
source:
  research: '168'
  written_by: Claude, for the operator's request for ten MFT-style stock scalps on minute data, 5-10 trades
    a day, Zerodha MIS leverage
  day: '2026-11-07'
configurations:
- shape: intraday_cash
  kind: prior-day break
  rule: among the 100 most traded stocks, level = previous session's highest 5-minute close; from 10:00
    to 14:00 the first close above it with the Nifty up on the day buys (below the previous lowest close
    with the Nifty down sells); stop at the fill after a close 0.5% back through the level; else 15:10;
    at most ten a day, first signals first
  data: research 161's minute snapshots of the 416 F&O stocks (5-minute closes and next-minute fills,
    09:20 to 15:10); Nifty 50 index minutes; Nifty 50 daily closes for beta
  timeframe: 5-minute closes
  costs: cash intraday charges plus 2 bps a side; Rs 5 lakh a trade (Rs 1 lakh margin at Zerodha's 5x
    MIS), at most 10 open at once on Rs 10 lakh of margin; returns on the Rs 10 lakh
  window: 2021-11-01 to 2024-10-15 (Nifty minutes start 2021-11-01; the last index file before the 2024-11-30
    cut ends 2024-10-15)
red_flags:
- Close to H-0016 (prior-day pivot breakout, dead).
- Ten rules written together; under the simple gate (no search correction) about one in twenty pure-noise
  rules would pass at 5%, so a single pass among ten is weak evidence.
- Decisions and stops on 5-minute closes only (the snapshots keep no highs, lows or volume per bar); a
  real stop would trigger inside the bar.
- 2 bps a side of slippage is assumed for every stock in the liquid set, not measured (T-906, A-052).
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
result: 'Screen 2026-11-07: 8855 trades (12.16 a day), 4.66 bps gross and -3.81 net a trade at Rs 5 lakh
  (cost 8.47), net Sharpe -0.866, halves -0.496 / -1.221, drawdown -95% of margin; by year on margin 2021
  -2%, 2022 -34%, 2023 -68%, 2024 -54% (research 168). Fails the screen; not gated.'
