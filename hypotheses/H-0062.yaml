id: H-0062
title: 'On weekly expiry day, follow the Nifty''s move so far into the last half hour'
status: draft
family: intraday_cash
source_kind: paper
parent: ''
claim: 'On each weekly Nifty expiry day, trading NIFTYBEES in the direction of the Nifty''s move from the prior close to 14:40, from 14:41 to 15:10, earns more than costs in both halves of 2021-11 to 2024-11.'
rationale: 'Baltussen, Da, Lammers and Martens (2021, JFE 142(1)): dealers hedging short gamma trade with the move, creating market intraday momentum into the close, strongest when their gamma exposure is most negative; expiry days carry the most gamma. Gao et al.''s unconditional version was dead on NIFTYBEES (research 071). Research 158.'
source:
  research: '158'
  written_by: Claude, for the operator's request for five more minute-level cash strategies
  day: '2026-11-05'
configurations:
- shape: intraday_cash
  strategy: 'nifty_expiry_gamma_momentum_niftybees'
  signal: 'sign of the Nifty 50 move from the prior close to the 14:40 close (minute 325), on weekly expiry days only'
  entry: '14:41 open; exit: 15:10'
  costs: 'cash intraday as for a share plus 2 bps a side; NIFTYBEES ₹10 lakh, 1x'
  window: '2021-11-01 to 2024-11-29'
red_flags:
- 'The paper conditions on measured dealer gamma, which is not available here; expiry day is a proxy.'
- 'A 30-minute NIFTYBEES move averages 11-15 bps against a 7.99 bps round trip: it must be right most of the time.'
- 'Screening backtest only: no trial spent, not judged by the gate.'
holdout:
  starts: '2024-12-01'
  status: unread
