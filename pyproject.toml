[project]
name = "eulerlab"
version = "0.0.0"
description = "Quant research and execution platform (theeulerlab)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.73",
    "kiteconnect>=5.2.1",
    "orjson>=3.10",
    "pyarrow>=25.0.1",
    "pydantic>=2.9",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The API that backs the web UI. An optional extra rather than a core
# dependency: everything in `make verify` runs without it, and a headless
# machine doing an overnight backfill has no reason to install a web server.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# Cross-source verification only. The crypto INGEST deliberately needs none of
# this — it reads Binance's bulk archive over plain urllib — but checking that
# archive against an independent venue needs a client that speaks many
# exchanges, and writing one would be worse than depending on one. Optional
# because a machine doing an overnight backfill has no reason to install it.
crypto = [
    "ccxt>=4.4",
]
# The explicitly sourced NSE decision-tree screen uses scikit-learn. Kept
# optional so normal ingestion and API installs do not acquire the ML stack.
research-ml = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
]
# Angel One's authenticated history endpoint is only needed for its data
# backfill and live broker paths. Keep the SDK out of non-Angel installs.
angel = [
    "logzero>=1.7",
    "pyotp>=2.9",
    "smartapi-python>=1.5.5",
    "websocket-client>=1.8",
]
dev = [
    "boto3-stubs>=1.43.73",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pyarrow-stubs>=20.0.0.20260625",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eulerlab"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]
# docs/ is prose. Ruff formats Python code blocks inside Markdown, which would
# silently rewrite the reference documents. They are read-only source material.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PD",   # pandas-vet (guards .shift/.rolling misuse later)
    "DTZ",  # naive-datetime detection: every timestamp must be tz-aware
    # Added 2026-10-12 after a pass over every file (T-4069).
    "C4",   # comprehensions: no list() around a generator, no dict() calls
    "PIE",  # needless code
    "FURB", # the modern spelling: min() not sorted()[0], re.DOTALL not re.S
    "PERF", # work done in a loop that need not be
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RET",  # returns that say what they return
]
ignore = [
    "E501",  # line length is handled by the formatter
    # Loop-or-comprehension is a style call, and the 16 loops these flag are in
    # order handling, the backtest and report rendering, where a plain loop
    # with a comment per branch reads better than the comprehension would.
    "PERF401",
    "PERF403",
    # Rebinding the loop variable to its merged form is deliberate in the two
    # ingests that do it (first-sighting knowledge_time wins).
    "PLW2901",
    # One module-level call counter, guarding a daily API quota.
    "PLW0603",
]

[tool.ruff.lint.isort]
known-first-party = ["eulerlab", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools", "tests"]
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

# ccxt ships no type stubs and is optional, so it is unresolvable on a machine
# that has not installed the `crypto` extra. Ignored here rather than silenced
# at each import, so the exemption is visible in one place.
[[tool.mypy.overrides]]
module = ["ccxt.*", "ccxt", "kiteconnect.*", "kiteconnect", "sklearn.*", "sklearn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
