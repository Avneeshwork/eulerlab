[project]
name = "eulerlab"
version = "0.0.0"
description = "Quant research and execution platform (theeulerlab)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.73",
    "kiteconnect>=5.2.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.9",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs>=1.43.73",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pyarrow-stubs>=20.0.0.20260625",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eulerlab"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]
# docs/ is prose. Ruff formats Python code blocks inside Markdown, which would
# silently rewrite the reference documents. They are read-only source material.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PD",   # pandas-vet (guards .shift/.rolling misuse later)
    "DTZ",  # naive-datetime detection: every timestamp must be tz-aware
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["eulerlab", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools", "tests"]
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
