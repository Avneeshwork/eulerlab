<title>EulerLab Market Handbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reference manual. Sticky search bar, topic rail on the left, one page at a time on the right. */
:root {
  --paper: #f6f7f4; --sheet: #ffffff; --ink: #18211f; --muted: #5d6a66; --rule: #dde3df;
  --accent: #0f6b5c; --accent-soft: #e2f1ec; --mark: #b45f06; --mark-soft: #fbefdf;
  --held-yes: #0f6b5c; --held-no: #9a3b2e; --held-no-soft: #f8e6e2;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111716; --sheet: #172020; --ink: #e5ece9; --muted: #9aa9a4; --rule: #2a3533;
  --accent: #5cc4ad; --accent-soft: #1d3330; --mark: #f0a24d; --mark-soft: #33271a;
  --held-yes: #5cc4ad; --held-no: #f08a77; --held-no-soft: #3a221e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #111716; --sheet: #172020; --ink: #e5ece9; --muted: #9aa9a4; --rule: #2a3533;
  --accent: #5cc4ad; --accent-soft: #1d3330; --mark: #f0a24d; --mark-soft: #33271a;
  --held-yes: #5cc4ad; --held-no: #f08a77; --held-no-soft: #3a221e; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font: 15px/1.6 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font: 0.86em var(--mono); background: var(--accent-soft); padding: 0.05em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { font: 600 1.15rem/1.1 var(--display); letter-spacing: 0.01em; cursor: pointer; white-space: nowrap; }
.brand small { display: block; font: 500 0.68rem var(--body); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
#q { flex: 1 1 260px; min-width: 0; font: 15px var(--body); padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); }
.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto;
  padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; font-size: 0.9rem; }
nav.rail h4 { font: 600 0.7rem var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
nav.rail button { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font: inherit; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
nav.rail button:hover { background: var(--accent-soft); }
nav.rail button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.rail .n { color: var(--muted); font: 0.8rem var(--mono); font-variant-numeric: tabular-nums; }
main { min-width: 0; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 26px clamp(18px, 4vw, 40px); }
h1, h2 { font-family: var(--display); font-weight: 600; text-wrap: balance; line-height: 1.2; }
h1 { font-size: clamp(1.6rem, 3.4vw, 2.1rem); margin: 0 0 6px; }
h2 { font-size: 1.35rem; margin: 30px 0 8px; }
h3 { font: 600 0.78rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 8px; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 64ch; margin: 0 0 18px; }
.prose { max-width: 72ch; }
.prose p { margin: 0 0 12px; }
.prose ul { margin: 0 0 14px; padding-left: 20px; }
.prose li { margin: 4px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; }
.chip { font: 500 0.76rem var(--body); padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.chip.no { background: var(--held-no-soft); color: var(--held-no); }
.chip.fam { background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
.card { text-align: left; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 14px 16px; cursor: pointer; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 4px; }
.card:hover { border-color: var(--accent); }
.card b { font: 600 1rem var(--display); }
.card span { color: var(--muted); font-size: 0.86rem; }
.list { display: flex; flex-direction: column; margin-top: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 12px 4px; cursor: pointer; font: inherit; color: inherit; }
.row:hover b { color: var(--accent); }
.row b { font: 600 1rem var(--display); display: block; }
.row span { color: var(--muted); font-size: 0.88rem; }
.row .held { font: 500 0.72rem var(--body); white-space: nowrap; }
.decision { border-left: 3px solid var(--mark); background: var(--mark-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 10px 0; max-width: 72ch; }
.decision b { color: var(--mark); }
.tbl { overflow-x: auto; margin: 6px 0 16px; }
table { border-collapse: collapse; font-size: 0.9rem; min-width: 480px; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--rule); }
th { font-weight: 600; color: var(--muted); }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 12px 0 6px; }
.step { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
.step b { display: block; font: 600 0.95rem var(--display); margin-bottom: 4px; }
.step span { font-size: 0.88rem; color: var(--muted); }
.crumbs { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
.crumbs button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
.empty { color: var(--muted); padding: 20px 0; }
pre.cmd { font: 0.85rem var(--mono); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; overflow-x: auto; margin: 6px 0 12px; }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.rail { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  nav.rail h4 { display: none; }
  nav.rail button { width: auto; white-space: nowrap; border: 1px solid var(--rule); gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="bar">
  <div class="brand" id="home" role="link" tabindex="0">Market Handbook<small>EulerLab metrics library</small></div>
  <input id="q" type="search" placeholder="Search the handbook: VIX, repo rate, deflated Sharpe, F&amp;O ban…" aria-label="Search the handbook" autocomplete="off">
</header>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Topics"></nav>
  <main id="main"></main>
</div>

<script>
const DATA = /*__DATA__*/null;
const byId = Object.fromEntries(DATA.pages.map(p => [p.id, p]));
const famTitle = Object.fromEntries(DATA.families.map(f => [f.id, f.title]));
const main = document.getElementById('main');
const rail = document.getElementById('rail');
const q = document.getElementById('q');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const GUIDES = [
  ['start', 'Start here'],
  ['answer', 'How to read and answer'],
  ['current', 'How it stays current'],
  ['decisions', 'Waiting on you'],
];

function railHtml(active) {
  let h = '<h4>Guide</h4>';
  for (const [id, t] of GUIDES) h += `<button data-go="${id}" aria-current="${active===id}">${t}</button>`;
  h += '<h4>Topics</h4>';
  for (const f of DATA.families) h += `<button data-go="${f.id}" aria-current="${active===f.id}"><span>${f.title}</span><span class="n">${f.count}</span></button>`;
  rail.innerHTML = h;
}

function heldChip(p) {
  if (!p.held) return '';
  const no = /^no\b/i.test(p.held);
  return `<span class="chip ${no ? 'no' : ''}">${no ? 'Not held' : 'Held'}</span>`;
}

function row(p) {
  const no = /^no\b/i.test(p.held || '');
  const held = p.held ? `<span class="held" style="color:var(${no ? '--held-no' : '--held-yes'})">${no ? 'not held' : 'held'}</span>` : '';
  return `<button class="row" data-go="${p.id}"><div><b>${esc(p.name)}</b><span>${esc(p.one)}</span></div>${held}</button>`;
}

const VIEWS = {
  start() {
    return `<div class="sheet prose">
      <h1>Market Handbook</h1>
      <p class="lede">What every number on the platform means, what is normal for it on your own data, how to read it, and what it does not tell you. ${DATA.pages.length} pages in ${DATA.families.length} topics, the same pages the assistant and the agents read before they answer.</p>
      <h2>How a page is laid out</h2>
      <p>Every page uses the same order, so you can jump to the part you need:</p>
      <ul>
        <li><strong>In one line</strong>: the meaning, in a sentence.</li>
        <li><strong>Where you see it</strong>: the screen, the brief row or the data field.</li>
        <li><strong>How we compute it</strong>: the formula as this platform's code does it, with the file.</li>
        <li><strong>Do we hold it</strong>: whether the platform actually has the data (economy and policy pages).</li>
        <li><strong>What is normal</strong>: ranges from your own data, with the window and the date.</li>
        <li><strong>How to read it</strong>, <strong>What it does not tell you</strong>, <strong>Traps</strong>: the interpretation.</li>
        <li><strong>Sources</strong> and <strong>Example answers</strong>.</li>
      </ul>
      <h2>Topics</h2>
      <div class="grid">${DATA.families.map(f => `<button class="card" data-go="${f.id}"><b>${f.title}</b><span>${f.count} pages · ${esc(DATA.pages.find(p => p.family===f.id).name)}…</span></button>`).join('')}</div>
      <h2>Using it outside this page</h2>
      <ul>
        <li>In the workbench, ask the assistant "what does X mean". It looks the page up (<code>explain_metric</code>) and adds today's live range.</li>
        <li>The files live in the repository under <code>docs/METRICS/</code>, one Markdown file per page.</li>
        <li>This page was built from those files at ${esc(DATA.built)}. The files are the source of truth; <code>make handbook</code> rebuilds it.</li>
      </ul>
    </div>`;
  },
  answer() {
    return `<div class="sheet prose"><div class="crumbs">Guide</div><h1>How to read and answer</h1>
      <p class="lede">The rules every answer about markets, strategies and risk follows. The assistant, the brief and the knowledge agent are held to them, and they are a good way to read the pages too.</p>${DATA.answer}</div>`;
  },
  current() {
    return `<div class="sheet prose"><div class="crumbs">Guide</div><h1>How it stays current</h1>
      <p class="lede">An agent, the knowledge keeper, reads for the library. You stay the editor: nothing in the pages changes until you approve it.</p>
      <div class="flow">
        <div class="step"><b>Daily, after the close</b><span>Recomputes what is normal for each market metric from your data. Reads the SEBI, RBI and NSE circular feeds and saves each day's copy.</span></div>
        <div class="step"><b>New rule notices</b><span>A notice whose title matches a topic goes to your inbox with its link and the pages it may change.</span></div>
        <div class="step"><b>Weekly, Sunday</b><span>Lists overdue assumptions, pages with aged ranges, dashboard sections with no page, and questions no page answered.</span></div>
        <div class="step"><b>Drafts for you</b><span>Up to three page updates drafted from the official text only. Any invented number drops the draft.</span></div>
      </div>
      <h2>Your commands</h2>
      <pre class="cmd">make knowledge-keeper              # the daily pass now
make knowledge-keeper MODE=weekly  # gaps and drafts now
make metrics-normals               # just recompute normal ranges
make metrics-accept DRAFT=&lt;path&gt;   # apply a draft you approved</pre>
      <h2>What it watches</h2>
      <ul><li>SEBI press releases, circulars and orders (RSS)</li><li>RBI press releases and notifications (RSS)</li><li>NSE circulars (RSS)</li></ul>
      <p>MoSPI (CPI, GDP, IIP) and AMFI (mutual fund flows) have no feed yet, so they are not watched. Economic release dates still come from the economic calendar.</p>
      <h2>What it will never do</h2>
      <ul><li>Change a page itself.</li><li>Draft a page with no source material. A question with no page becomes a proposal for you instead.</li><li>Follow instructions found in a feed or a page.</li></ul>
    </div>`;
  },
  decisions() {
    const rows = DATA.waiting.map(t => `<div class="decision"><b>${esc(t.id)}</b><br>${esc(t.task)}<br><span style="color:var(--muted)">${esc(t.status)}</span></div>`).join('');
    return `<div class="sheet prose"><div class="crumbs">Guide</div><h1>Waiting on you</h1>
      <p class="lede">Open tasks in TASKS.md that need your decision, read when this page was built.</p>
      ${rows || '<p class="empty">Nothing is waiting on you.</p>'}</div>`;
  },
};

function familyView(fid) {
  const ps = DATA.pages.filter(p => p.family === fid);
  return `<div class="sheet"><div class="crumbs">Topic</div><h1>${famTitle[fid]}</h1><p class="lede">${ps.length} pages.</p><div class="list">${ps.map(row).join('')}</div></div>`;
}

function pageView(p) {
  return `<article class="sheet prose"><div class="crumbs"><button data-go="${p.family}">${famTitle[p.family]}</button></div>
    <h1>${esc(p.name)}</h1><div class="chips"><span class="chip fam">${famTitle[p.family]}</span>${heldChip(p)}</div>${p.html}</article>`;
}

function searchView(text) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  const scored = DATA.pages.map(p => {
    let s = 0;
    for (const w of words) {
      if (!p.text.includes(w)) return [p, 0];
      if (p.name.toLowerCase().includes(w)) s += 5;
      if (p.one.toLowerCase().includes(w)) s += 2;
      s += 1;
    }
    return [p, s];
  }).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const list = scored.length ? `<div class="list">${scored.slice(0, 40).map(x => row(x[0])).join('')}</div>` : `<p class="empty">No page mentions “${esc(text)}”. Try a shorter word.</p>`;
  return `<div class="sheet"><div class="crumbs">Search</div><h1>${scored.length} result${scored.length===1?'':'s'}</h1>${list}</div>`;
}

function show(token, push = true) {
  let html, active = token;
  if (VIEWS[token]) html = VIEWS[token]();
  else if (famTitle[token]) html = familyView(token);
  else if (byId[token]) { html = pageView(byId[token]); active = byId[token].family; }
  else { token = 'start'; active = 'start'; html = VIEWS.start(); }
  main.innerHTML = html;
  railHtml(active);
  if (push) { try { history.replaceState(null, '', '#' + token); } catch (e) {} }
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-page]');
  if (!t) return;
  e.preventDefault();
  q.value = '';
  show(t.dataset.go || t.dataset.page);
});
document.getElementById('home').addEventListener('click', () => { q.value = ''; show('start'); });
document.getElementById('home').addEventListener('keydown', e => { if (e.key === 'Enter') { q.value = ''; show('start'); } });
let timer;
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const v = q.value.trim();
    if (v.length < 2) { show((location.hash || '#start').slice(1), false); return; }
    main.innerHTML = searchView(v); railHtml('');
  }, 120);
});
show((location.hash || '#start').slice(1), false);
</script>
