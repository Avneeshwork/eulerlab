# THE MANDATE — operator-owned. Written once in Sprint 14, then hands off.
#
# CLAUDE.md: "gates.py and mandate.yaml are operator-owned. You may propose
# changes in a review; you may not edit them without an explicit instruction in
# that session."
#
# This file is deliberately only numbers and prose. All logic lives in
# gates.py, so changing what the gate demands never requires changing code —
# and so a threshold cannot be quietly relaxed inside a refactor.
#
# Every threshold below is a REFUSAL condition. The gate's default answer is
# no. That asymmetry is the point: the cost of wrongly killing a good strategy
# is a missed opportunity, and the cost of wrongly promoting a bad one is
# money. Those are not symmetric and the numbers should not pretend they are.

version: 2
owner: operator
last_reviewed: 2026-11-16

# Which bar the gate applies. Changed on the operator's instruction, 2026-11-06
# (ADR-140): "gate is too hard, make it simple". `simple` checks only the
# `simple` block below; `strict` checks `statistical` and `robustness`. The
# strict thresholds are kept unchanged so switching back is one word. The
# `process` rules apply in both modes.
mode: simple

simple:
  # Net of costs, the full-sample Sharpe must be above zero.
  require_positive_full_sample: true
  # ... and above this floor. Operator, 2026-11-15: "less than .5 sharpe should
  # not be in paper", "in promote also set .5 sharpe as floor", and "Approve
  # 0.5 Sharpe floor for PAPER and PROMOTE in gates.py and mandate.yaml, on the
  # gate Sharpe" (ADR-207). The gate's own full-sample net Sharpe.
  min_full_sample_sharpe: 0.5
  # Each half of the history, split at the midpoint, must be net positive.
  require_positive_each_half: true
  # Still net positive with every charge and slippage doubled.
  require_positive_at_2x_costs: true
  # Added on the operator's instruction, 2026-11-06 ("test other metrics, if
  # the backtest is really profitable, like probabilistic Sharpe, stable").
  # Probabilistic Sharpe ratio: the chance the true Sharpe is above zero given
  # the sample's length, skew and tails. Not corrected for how many strategies
  # were tried; that is the deflated Sharpe, which strict mode uses.
  # Lowered from 0.95 on the operator's instruction, 2026-11-15 ("make sharpe
  # bar to minimum", decision card "Sharpe above zero, keep checks", ADR-198).
  # A PSR of 0.50 is the same test as a net Sharpe above zero.
  min_probabilistic_sharpe: 0.50
  # Stability: the share of calendar years (with at least this many trading
  # days in the backtest) whose net return was positive.
  min_positive_year_fraction: 0.6
  stability_min_days_in_year: 60

# The paper bar (ADR-141). Operator, 2026-11-06: "make gate less strict so that
# profitable strategies get a chance for paper trading and more evaluation
# instead of rejecting directly". A strategy that misses the promotion bar above
# but clears this one gets verdict PAPER: it may be paper-traded for forward
# evidence and re-gated with it. It may not read the holdout or trade live.
# Process rules still apply: a PAPER needs sound, pre-registered evidence.
paper:
  # Net of costs, the full-sample Sharpe must be above this. Raised from 0.0 on
  # the operator's instruction, 2026-11-15: "less than .5 sharpe should not be
  # in paper" (ADR-207).
  min_full_sample_sharpe: 0.5
  # The chance the true Sharpe is above zero, from the sample alone.
  # Lowered from 0.80 with the promotion bar, 2026-11-15 (ADR-198).
  min_probabilistic_sharpe: 0.50

# --- strict mode only (mode: strict) ---

statistical:
  # Probability the true Sharpe exceeds zero, after correcting for how many
  # configurations have ever been evaluated. 0.95 is the conventional bar.
  min_deflated_sharpe_probability: 0.95

  # Probability of backtest overfitting. Above 0.25 means selecting on past
  # performance is substantially picking noise; above 0.50 is worse than
  # choosing at random.
  max_pbo: 0.25

  # The t > 3 rule. With many trials, t > 2 is routine noise.
  min_t_statistic: 3.0

  # The backtest must be at least this many times longer than the minimum
  # length implied by the trial count. 1.0 means "exactly long enough", which
  # leaves no margin.
  min_backtest_length_ratio: 1.5

  # How the bar accounts for the search. Changed on the operator's instruction,
  # 2026-10-31 (decision card "Families plus Romano-Wolf", ADR-108, research
  # 138). Before: N = trial-ledger rows, spread of Sharpes assumed 1.0.
  # Now: N = families of every strategy tested (clustered at this average
  # correlation), spread measured across those families, and the candidate's
  # return over Nifty must also survive Romano-Wolf StepM at this level,
  # tested jointly with every stored strategy.
  search_correction:
    method: families
    family_join_correlation: 0.7
    romano_wolf_required: true
    romano_wolf_alpha: 0.05
    romano_wolf_block_days: 20
    romano_wolf_draws: 2000

robustness:
  # Fraction of the base Sharpe that must survive each stress test.
  min_sharpe_retained_at_2x_costs: 0.60
  min_sharpe_retained_dropping_best_names: 0.60

  # The weakest regime must retain this fraction of the base Sharpe. A
  # strategy that works in one half of the history and not the other has not
  # been shown to work; it has been shown to have worked.
  min_sharpe_retained_worst_regime: 0.50

  # No stress test may turn the result negative, whatever the retained fraction.
  allow_any_negative_stress: false

process:
  # The hypothesis must have been registered, with red flags, before the
  # evidence existed. A claim written after seeing results is not a claim.
  require_pre_registration: true

  # The evidence pack must carry a matching hash. An unsigned pack could have
  # been edited after the run.
  require_signed_evidence: true

  # The trial ledger's hash chain must verify. Every statistic above divides
  # by the trial count, so an unverifiable count makes them all meaningless.
  require_intact_trial_ledger: true

  # The holdout may be read exactly once, by the operator's action, and only
  # after everything above has passed. It is the last evidence the project has
  # and it cannot be regenerated.
  holdout_reads_permitted: 1

forward_evidence:
  # Added on the operator's instruction, 2026-10-17 (ADR-078).
  # Minute data on or before this date is the holdout (read once, by the
  # operator). Minute data after it is forward paper evidence: paper books read
  # it only from each deployment's start, never earlier, never as warmup.
  holdout_end: 2026-10-17

forward_test:
  # Added on the operator's instruction, 2026-11-02 ("add it", ADR-117). Read
  # by forward.ready_for_live: what a gate-promoted strategy's paper
  # deployment must show before live trading is allowed. The gate's own rules
  # above are unchanged.
  min_days: 60                       # trading days on paper since the deployment started
  min_sharpe_ratio_of_backtest: 0.5  # forward Sharpe at least half the backtest's
  max_drawdown: 0.25                 # no deeper than -25% from the paper book's peak

notes: >
  A strategy that fails this gate is dead. It is not tuned and resubmitted, and
  the gate is not argued with — that rule exists precisely for the moment when
  the result is unwelcome and a reason to make an exception is available.
  Resubmitting the same idea under a new hypothesis id is visible in the trial
  ledger and is the thing this whole apparatus exists to prevent.
